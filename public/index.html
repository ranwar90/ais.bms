function prevWeekIdOf(weekId) {
  const d = new Date(weekId + 'T00:00:00');
  d.setDate(d.getDate() - 7);
  return weekIdFor(d);
}
function weekHasAnyData(weekId) {
  return Object.values(state.points).some(doc => doc && doc.weeks && doc.weeks[weekId]);
}
/** Most recognitions this week. Same eligibility floor as the homepage boards (>= 75 pts).
 *  Ties at 5th place are included, capped at 8 so the slide stays readable. */
function dispStars() {
  const wk = currentWeekId();
  const list = state.students.map(st => {
    const wd = getWeekData(st.id, wk);
    const recs = wd.recognitions || [];
    const groups = {};
    recs.forEach(r => {
      const g = groups[r.label] || (groups[r.label] = { emoji: r.emoji || '⭐', label: r.label, count: 0 });
      g.count++;
    });
    return { name: st.name, className: st.className, total: wd.total, count: recs.length,
      groups: Object.values(groups).sort((a,b) => b.count - a.count) };
  }).filter(s => s.count > 0 && s.total >= RECOGNITION_FLOOR)
    .sort((a,b) => b.count - a.count || b.total - a.total || a.name.localeCompare(b.name));
  return list.slice(0, 10); // exactly 10: most skills first, then points, then name
}
/** This week (live) vs last week. Needs at least one record in last week to be meaningful. */
function dispImproved() {
  const cur = currentWeekId(), prev = prevWeekIdOf(cur);
  if (!weekHasAnyData(prev)) return { ready: false };
  const classes = CLASSES.map(c => {
    const studs = state.students.filter(s => s.className === c);
    if (!studs.length) return null;
    const avg = wk => studs.reduce((s, st) => s + weeklyTotal(st.id, wk), 0) / studs.length;
    const now = avg(cur), before = avg(prev);
    return { className: c, now, before, delta: now - before };
  }).filter(Boolean).sort((a,b) => b.delta - a.delta || b.now - a.now);
  const studs = state.students.map(st => {
    const now = weeklyTotal(st.id, cur), before = weeklyTotal(st.id, prev);
    return { name: st.name, className: st.className, now, before, delta: now - before };
  }).filter(s => s.delta > 0 && s.now >= RECOGNITION_FLOOR)
    .sort((a,b) => b.delta - a.delta || b.now - a.now || a.name.localeCompare(b.name));
  return {
    ready: true,
    topClass: classes.length && classes[0].delta > 0.05 ? classes[0] : null,
    topStudents: studs.length ? studs.filter(s => s.delta === studs[0].delta).slice(0, 3) : [],
  };
}

/** Same ranking rule as everywhere else: average points (1 decimal), then skills recognitions;

function rankClassList(list) {
  list.sort((a, b) => b.avgKey - a.avgKey || b.skills - a.skills || a.className.localeCompare(b.className));
  list.forEach((c, i) => { const p = list[i - 1]; c.rank = p && p.avgKey === c.avgKey && p.skills === c.skills ? p.rank : i + 1; });
  return list;
}

/** Class ranks at an earlier moment, rebuilt from the timestamped log (nothing extra is stored).
 *  Monday–Saturday: as at the end of yesterday. Sunday (first day of the week): as at one hour earlier,
 *  so arrows show live movement within the lesson. Returns null while everyone is still level, so the
 *  week never opens with a wall of down arrows. */
function standingsBeforeToday(weekId) {

  const earlier = x => firstDay
    ? (x.time ? Date.parse(x.time) < cutoff : false)
    : (x.date ? x.date < today : false);

  state.students.forEach(st => {
    const wd = getWeekData(st.id, weekId);
    const ded = (wd.deductions || []).filter(d => d.category !== 'Admin Adjustment' && earlier(d));
    const rec = (wd.recognitions || []).filter(earlier);
    const b = byClass[st.className] || (byClass[st.className] = { className: st.className, sum: 0, count: 0, skills: 0 });
    b.sum += WEEK_START_POINTS - DEDUCTION_AMOUNT * ded.length; b.count++; b.skills += rec.length;
  });
  const list = Object.values(byClass).map(b => { const avg = b.count ? b.sum / b.count : 0; return { className: b.className, avgKey: Math.round(avg * 10) / 10, skills: b.skills }; });
  const ranked = rankClassList(list);
  if (ranked.every(c => c.rank === 1)) return null; // everyone level then: nothing to compare against

const PRINT_ICON = '<svg class="d-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="8" rx="1.5"/><path d="M7 13.5h10v7H7z"/></svg>';
async function dispPresent() { state.disp.present = true; await dispBroadcast(true); }
async function dispBroadcast(fromPresent) {
  if (fromPresent !== true) state.disp.present = false;
  state.disp.mode = 'broadcast'; state.disp.slide = 0; state.disp.slideStartedAt = Date.now();
  state.disp.hintUntil = Date.now() + DISP_SLIDE_MS - 500;
  dispRestartInterval(); render();
  try {
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
      state.disp.wasFull = true;
    }
  } catch (e) { /* fullscreen not allowed here, the fixed overlay still fills the view */ }
}
function dispExit() {
  if (state.disp.timer) { clearInterval(state.disp.timer); state.disp.timer = null; }
  state.disp.mode = null;
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  state.disp.wasFull = false;
  render();
}
function dispToggleOrientation() {
  state.disp.orientation = state.disp.orientation === 'landscape' ? 'portrait' : 'landscape';
  try { localStorage.setItem('g8_disp_orient', state.disp.orientation); } catch (e) {}
  render();
}
function dispPrint() {
  try { window.print(); } catch (e) { toast('Press Ctrl+P (Cmd+P on Mac) to print.'); }
}
window.addEventListener('resize', () => { if (state.disp.mode) render(); });
document.addEventListener('keydown', e => {
  if (!state.disp.mode) return;
  if (e.key === 'Escape') dispExit();
  else if (e.key === 'ArrowRight') dispNav(1);
  else if (e.key === 'ArrowLeft') dispNav(-1);
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && state.disp.mode === 'broadcast' && state.disp.wasFull) dispExit();
});

/* ---------------- views ---------------- */
function renderHallwayTab(role) {
  const teacher = role === 'teacher';
  const portrait = state.disp.orientation === 'portrait';
  const tw = portrait ? 180 : 320, th = portrait ? 320 : 180;
  const thumbs = DISP_SLIDES.map((name, i) =>
    '<div class="d-thumb"><div class="d-thumb-frame" style="width:' + tw + 'px;height:' + th + 'px">' + dispStage(i, { w: tw, h: th }) + '</div>' +
    '<div class="subtle" style="margin-top:6px;text-align:center;font-weight:700;">' + name + '</div></div>').join('');
  const themes = DISP_THEMES.map(t => '<button class="theme-chip' + (state.disp.theme === t.id ? ' active' : '') + '" onclick="setDispTheme(\'' + t.id + '\')">' +
    '<span class="theme-sw" style="background:' + t.sw + '"></span>' + t.name + '</button>').join('');
  return '<div class="card"><h2>Hallway Display</h2>' +
      '<div class="subtle">' + (teacher
        ? 'Show the live leaderboards full screen at the end of a lesson. Only positive rankings are shown.'
        : 'A live showcase for corridor screens. It updates by itself as teachers log. Only positive rankings are shown; Needs Intervention never appears on the display.') + '</div>' +
      '<div class="theme-row"><span class="theme-label">Theme</span>' + themes + '</div>' +
      '<div class="row d-controls">' +
        '<button class="btn d-rotate" onclick="dispToggleOrientation()" title="Switch portrait / landscape">' + ROTATE_ICON + ' ' + (portrait ? 'Portrait' : 'Landscape') + '</button>' +
        '<button class="btn" onclick="dispPreview()">' + EYE_ICON + ' Preview</button>' +
        '<button class="btn" onclick="dispPrint()">' + PRINT_ICON + ' Print PDF</button>' +
        (teacher ? '<button class="btn primary" onclick="dispPresent()">' + PRESENT_ICON + ' Present</button>'
                 : '<button class="btn primary" onclick="dispBroadcast()">' + CAST_ICON + ' Broadcast</button>') +
      '</div>' +
      '<div class="subtle">Print: choose "Save as PDF" in the print dialog to get a PDF, one slide per page. If the dialog doesn\'t open, press Ctrl+P (Cmd+P on Mac) while on this tab.</div>' +
    '</div>' +
    '<div class="card"><h2>Slides · ' + (portrait ? 'portrait' : 'landscape') + '</h2><div class="d-thumbs">' + thumbs + '</div></div>';
}
function renderDisplayPreviewModal() {
  if (state.disp.mode !== 'preview') return '';
  const portrait = state.disp.orientation === 'portrait';
  const maxW = Math.min(window.innerWidth * 0.9, 1100), maxH = window.innerHeight * 0.68;
  let w, h;
  if (portrait) { h = Math.min(maxH, maxW * 16 / 9); w = h * 9 / 16; }
  else { w = Math.min(maxW, maxH * 16 / 9); h = w * 9 / 16; }
  w = Math.round(w); h = Math.round(h);
  return '<div class="modal-overlay" onclick="if(event.target===this)dispExit()"><div class="modal d-preview-modal">' +
    '<button class="btn ghost small close" onclick="dispExit()" aria-label="Close">✕</button>' +
    '<h3>Preview · ' + (portrait ? 'Portrait' : 'Landscape') + '</h3>' +
    '<div class="subtle">Slides change every ' + (DISP_SLIDE_MS / 1000) + ' seconds, exactly as they will when broadcasting.</div>' +
    '<div class="d-preview-frame" style="width:' + w + 'px;height:' + h + 'px">' +
      dispStage(state.disp.slide, { w, h, animate: dispShouldAnimate(), progress: true }) + '</div>' +
    '<div class="row" style="justify-content:center;margin-top:14px;">' +
      '<button class="btn" onclick="dispNav(-1)">◀ Prev</button>' +
      '<button class="btn" onclick="dispToggleOrientation()">' + ROTATE_ICON + ' Rotate</button>' +
      '<button class="btn" onclick="dispNav(1)">Next ▶</button>' +
      (state.user && state.user.role === 'admin' && state.view === 'admin'
        ? '<button class="btn primary" onclick="dispBroadcast()">' + CAST_ICON + ' Broadcast</button>'
        : '<button class="btn primary" onclick="dispPresent()">' + PRESENT_ICON + ' Present</button>') +
    '</div></div></div>';
}
/** Broadcast fills the whole view. If the chosen orientation doesn't match the screen
 *  (e.g. a TV mounted on its side but still receiving a landscape signal), the slide is
 *  turned 90° so it fills the physical screen the right way up. */
function renderBroadcast(app) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const actual = vw >= vh ? 'landscape' : 'portrait';
  const rotate = actual !== state.disp.orientation;
  const stage = dispStage(state.disp.slide, {
    w: rotate ? vh : vw, h: rotate ? vw : vh, fixed: true, rotate,
    animate: dispShouldAnimate(), progress: true,
  });
  const hint = Date.now() < state.disp.hintUntil
    ? (state.disp.present
      ? '<div class="d-casthint">' + PRESENT_ICON + ' Presenting. Use ← → to change slide; press Esc or ✕ to finish.</div>'
      : '<div class="d-casthint">' + CAST_ICON + ' To show this on the corridor screen: in Chrome open the ⋮ menu → <b>Cast…</b> → pick the screen → Sources → <b>Cast tab</b>. Press Esc or ✕ to exit.</div>')
    : '';
  app.innerHTML = '<div class="d-broadcast">' + stage +
    (state.disp.present ? '<button class="d-navbtn d-prev" onclick="dispNav(-1)" aria-label="Previous">‹</button><button class="d-navbtn d-next" onclick="dispNav(1)" aria-label="Next">›</button>' : '') +
    '<button class="d-exit" onclick="dispExit()">✕ ' + (state.disp.present ? 'Exit presentation' : 'Exit broadcast') + '</button>' + hint + '</div>';
}
/** Keeps a hidden print-only copy of all slides in sync while the admin is on the
 *  Hallway Display tab, so both the Print button and Ctrl/Cmd+P print the display. */
function syncPrintHost() {
  if (!state.disp) return;
  let host = document.getElementById('printHost');
  if (!host) { host = document.createElement('div'); host.id = 'printHost'; document.body.appendChild(host); }
  let pageStyle = document.getElementById('pageSizeStyle');
  if (!pageStyle) { pageStyle = document.createElement('style'); pageStyle.id = 'pageSizeStyle'; document.head.appendChild(pageStyle); }
  const on = !!(state.user && !state.disp.mode && ((state.view === 'admin' && state.aTab === 'hallway') || (state.view !== 'admin' && state.tView === 'hallway')));
  document.body.classList.toggle('has-print-display', on);
  if (!on) { if (host.innerHTML) host.innerHTML = ''; return; }
  const portrait = state.disp.orientation === 'portrait';
  pageStyle.textContent = '@page { size: A4 ' + (portrait ? 'portrait' : 'landscape') + '; margin: 0; }';
  host.innerHTML = DISP_SLIDES.map((_, i) =>
    '<div class="print-page print-' + (portrait ? 'portrait' : 'landscape') + '">' + dispStage(i, { print: true }) + '</div>').join('');
}

/* ============================= EXCEL REPORT (.xlsx) =============================
   Self-contained .xlsx writer (no external library to load or fail): builds the
   SpreadsheetML parts and packs them into an uncompressed zip. Palette follows the
   AIS logo: navy #1F4E96, teal #1E9CC4, gold #F5A623. */
const XL = (function () {
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  const enc = s => new TextEncoder().encode(s);
  function zip(files) { // files: [{name, data:Uint8Array}] -> stored (no compression) zip
    const parts = [], central = []; let off = 0;
    files.forEach(f => {
      const name = enc(f.name), d = f.data, crc = crc32(d);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true);
      h.setUint32(22, d.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, d);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
      cd.setUint16(10, 0, true); cd.setUint16(12, 0, true); cd.setUint16(14, 0x21, true); cd.setUint32(16, crc, true);
      cd.setUint32(20, d.length, true); cd.setUint32(24, d.length, true); cd.setUint16(28, name.length, true);
      cd.setUint32(42, off, true);
      central.push(new Uint8Array(cd.buffer), name);
      off += 30 + name.length + d.length;
    });
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
    const all = parts.concat(central, [new Uint8Array(e.buffer)]);
    const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0)); let p = 0;
    all.forEach(a => { out.set(a, p); p += a.length; });
    return out;
  }
  const esc = s => String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const col = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

  // Style indices (cellXfs order below)
  const S = { base: 0, title: 1, sub: 2, head: 3, text: 4, num: 5, section: 6, kpiLabel: 7, kpiValue: 8,
              high: 9, mid: 10, total: 11, note: 12, pct: 13, zebra: 14, zebraNum: 15, totalNum: 16 };
  const STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="11">' +
      '<font><sz val="10"/><color rgb="FF1B2430"/><name val="Arial"/></font>' +                 // 0
      '<font><b/><sz val="18"/><color rgb="FF1F4E96"/><name val="Arial"/></font>' +             // 1 title
      '<font><i/><sz val="10"/><color rgb="FF667085"/><name val="Arial"/></font>' +             // 2 sub
      '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font>' +             // 3 header
      '<font><b/><sz val="12"/><color rgb="FFFFFFFF"/><name val="Arial"/></font>' +             // 4 section
      '<font><b/><sz val="10"/><color rgb="FF1F4E96"/><name val="Arial"/></font>' +             // 5 kpi label
      '<font><b/><sz val="18"/><color rgb="FF1F4E96"/><name val="Arial"/></font>' +             // 6 kpi value
      '<font><b/><sz val="10"/><color rgb="FFB91C1C"/><name val="Arial"/></font>' +             // 7 high
      '<font><b/><sz val="10"/><color rgb="FF9A5B00"/><name val="Arial"/></font>' +             // 8 mid
      '<font><b/><sz val="10"/><color rgb="FF1B2430"/><name val="Arial"/></font>' +             // 9 total
      '<font><i/><sz val="10"/><color rgb="FF333333"/><name val="Arial"/></font>' +             // 10 note
    '</fonts>' +
    '<fills count="9"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
      ['FF1F4E96', 'FF1E9CC4', 'FFDCEBF7', 'FFFDE8E8', 'FFFFF4E0', 'FFF5A623', 'FFF4F8FC']
        .map(c => '<fill><patternFill patternType="solid"><fgColor rgb="' + c + '"/><bgColor indexed="64"/></patternFill></fill>').join('') +
    '</fills>' +
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
      '<border>' + ['left', 'right', 'top', 'bottom'].map(s => '<' + s + ' style="thin"><color rgb="FFD0D7E2"/></' + s + '>').join('') + '<diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="17">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +                                                                   // 0 base
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"><alignment vertical="center"/></xf>' +                  // 1 title
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"><alignment vertical="center"/></xf>' +                  // 2 sub
      '<xf numFmtId="0" fontId="3" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' + // 3 head
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf>' +     // 4 text
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"><alignment horizontal="center" vertical="top"/></xf>' + // 5 num
      '<xf numFmtId="0" fontId="4" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="center"/></xf>' +    // 6 section
      '<xf numFmtId="0" fontId="5" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' + // 7 kpi label
      '<xf numFmtId="0" fontId="6" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="center"/></xf>' + // 8 kpi value
      '<xf numFmtId="0" fontId="7" fillId="5" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf>' + // 9 high
      '<xf numFmtId="0" fontId="8" fillId="6" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf>' + // 10 mid
      '<xf numFmtId="0" fontId="9" fillId="7" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="center"/></xf>' + // 11 total
      '<xf numFmtId="0" fontId="10" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf>' + // 12 note
      '<xf numFmtId="9" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"><alignment horizontal="center" vertical="top"/></xf>' + // 13 pct
      '<xf numFmtId="0" fontId="0" fillId="8" borderId="1" xfId="0" applyFill="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf>' + // 14 zebra text
      '<xf numFmtId="0" fontId="0" fillId="8" borderId="1" xfId="0" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="top"/></xf>' + // 15 zebra num
      '<xf numFmtId="0" fontId="9" fillId="7" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="center"/></xf>' + // 16 total num
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  function sheetXml(sh, hasDrawing) {
    const rowsXml = sh.rows.map((row, r) => {
      if (!row) return '';
      const ht = sh.heights && sh.heights[r] ? ' ht="' + sh.heights[r] + '" customHeight="1"' : '';
      const cells = row.map((cell, ci) => {
        if (cell == null) return '';
        const ref = col(ci) + (r + 1), s = cell.s != null ? ' s="' + cell.s + '"' : '';
        if (cell.f) return '<c r="' + ref + '"' + s + '><f>' + esc(cell.f) + '</f>' + (cell.v != null ? '<v>' + cell.v + '</v>' : '') + '</c>';
        if (typeof cell.v === 'number') return '<c r="' + ref + '"' + s + '><v>' + cell.v + '</v></c>';
        if (cell.v == null || cell.v === '') return '<c r="' + ref + '"' + s + '/>';
        return '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + esc(cell.v) + '</t></is></c>';
      }).join('');
      return '<row r="' + (r + 1) + '"' + ht + '>' + cells + '</row>';
    }).join('');
    const pane = sh.freeze ? '<pane ySplit="' + sh.freeze + '" topLeftCell="A' + (sh.freeze + 1) + '" activePane="bottomLeft" state="frozen"/>' : '';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetPr><tabColor rgb="' + (sh.tab || 'FF1F4E96') + '"/><pageSetUpPr fitToPage="1"/></sheetPr>' +
      '<sheetViews><sheetView workbookViewId="0" showGridLines="0">' + pane + '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      '<cols>' + sh.widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>' +
      '<sheetData>' + rowsXml + '</sheetData>' +
      (sh.filter ? '<autoFilter ref="' + sh.filter + '"/>' : '') +
      (sh.merges && sh.merges.length ? '<mergeCells count="' + sh.merges.length + '">' + sh.merges.map(m => '<mergeCell ref="' + m + '"/>').join('') + '</mergeCells>' : '') +
      '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>' +
      '<pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>' +
      (hasDrawing ? '<drawing r:id="rId1"/>' : '') + '</worksheet>';
  }

  /** sheets: [{name, rows, widths, merges, freeze, filter, heights, tab, image:{png:Uint8Array, w, h}}] */
  function build(sheets) {
    const files = [];
    const ct = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
      '<Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/>',
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'];
    let img = 0;
    sheets.forEach((sh, i) => {
      ct.push('<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
      files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: enc(sheetXml(sh, !!sh.image)) });
      if (sh.image) {
        img++;
        ct.push('<Override PartName="/xl/drawings/drawing' + img + '.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>');
        files.push({ name: 'xl/media/image' + img + '.png', data: sh.image.png });
        files.push({ name: 'xl/worksheets/_rels/sheet' + (i + 1) + '.xml.rels', data: enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing' + img + '.xml"/></Relationships>') });
        files.push({ name: 'xl/drawings/_rels/drawing' + img + '.xml.rels', data: enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image' + img + '.png"/></Relationships>') });
        const cx = Math.round(sh.image.w * 9525), cy = Math.round(sh.image.h * 9525);
        files.push({ name: 'xl/drawings/drawing' + img + '.xml', data: enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
          '<xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>76200</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>57150</xdr:rowOff></xdr:from>' +
          '<xdr:ext cx="' + cx + '" cy="' + cy + '"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="2" name="AIS logo"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +

function dataUriToBytes(uri) {
  const b64 = uri.split(',')[1], bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/** Builds the Reports workbook: Dashboard, Deduction Log, Student Summary, Recognition Log.
 *  Respects the Class / Subject filters on the Reports page. Intervention sections and the
 *  per-teacher tally are included only in the admin's download. */
function buildReportWorkbook() {
  const isAdmin = state.user && state.user.role === 'admin';
  const R = computeReportData(isAdmin ? 'admin' : 'teacher');
  const L = R.labels, S = XL.S, C = XL.col;
  const cell = (v, s) => ({ v, s });
  const fcell = (f, v, s) => ({ f, v, s });
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const filterText = 'Class: ' + (state.rClass === 'ALL' ? 'All classes' : state.rClass) + '   ·   Subject: ' +
    (state.rSubject === 'ALL' ? 'All subjects' : state.rSubject) + '   ·   Period: ' + reportPeriodLabel() + '   ·   Generated ' +
    new Date().toLocaleString() + ' by ' + (state.user ? state.user.name : '');

  // ---------- Deduction Log (one row per deduction) ----------
  const LOG = 'Deduction Log';
  const logRows = [];
  R.rows.forEach(r => r.ded.forEach(d => logRows.push({ st: r.st, d })));
  logRows.sort((a, b) => (b.d.time || b.d.date || '').localeCompare(a.d.time || a.d.date || '') || a.st.name.localeCompare(b.st.name));
  const LOG_HEAD_ROW = 3, LOG_FIRST = 4, LOG_LAST = Math.max(LOG_FIRST, LOG_FIRST + logRows.length - 1);
  const logSheet = { name: LOG, tab: 'FFB91C1C', widths: [12, 12, 8, 34, 11, 14, 22, 30, 55], freeze: LOG_HEAD_ROW,
    merges: ['A1:I1', 'A2:I2'], heights: { 0: 26, 2: 30 }, rows: [] };
  logSheet.rows[0] = [cell('Deduction Log — every behaviour flag, with the teacher and their note', S.title)];
  logSheet.rows[1] = [cell(filterText, S.sub)];
  logSheet.rows[2] = ['Date', 'Week of', 'Class', 'Student', 'ID', 'Deduction', 'Subject', 'Teacher', 'Teacher note'].map(h => cell(h, S.head));
  logRows.forEach(({ st, d }, i) => {
    const z = i % 2 === 1, t = z ? S.zebra : S.text, n = z ? S.zebraNum : S.num;
    logSheet.rows[LOG_FIRST - 1 + i] = [cell(d.date || '', n), cell(d.date ? weekIdFor(new Date(d.date + 'T00:00:00')) : '', n), cell(st.className, n),
      cell(st.name, t), cell(st.id, n), cell('Not ' + d.category, S.high), cell(d.subject || '', t), cell(d.teacherName || '', t),
      cell(d.note || '', d.note ? S.note : t)];
  });
  if (!logRows.length) logSheet.rows[LOG_FIRST - 1] = [cell('No deductions recorded for this filter.', S.text)];
  logSheet.filter = 'A' + LOG_HEAD_ROW + ':I' + LOG_LAST;
  // Formula ranges over the log (column F holds "Not <category>", G subject, H teacher, D student).
  const rng = c => "'" + LOG + "'!$" + c + '$' + LOG_FIRST + ':$' + c + '$' + LOG_LAST;

  // ---------- Student Summary ----------
  const sumCols = ['Class', 'Student', 'ID'].concat(L.map(l => 'Not ' + l)).concat(['Total', 'Severity (this week)', 'Flagged in (subject · count)'])
    .concat(isAdmin ? ['Recommended intervention', 'Admin note'] : []);
  const sumSheet = { name: 'Student Summary', tab: 'FF1E9CC4', freeze: 3, merges: ['A1:' + C(sumCols.length - 1) + '1', 'A2:' + C(sumCols.length - 1) + '2'],
    widths: [8, 34, 11].concat(L.map(() => 13)).concat([9, 16, 38]).concat(isAdmin ? [40, 40] : []), heights: { 0: 26, 2: 30 }, rows: [] };
  sumSheet.rows[0] = [cell('Student Summary — flags per student', S.title)];
  sumSheet.rows[1] = [cell(filterText, S.sub)];
  sumSheet.rows[2] = sumCols.map(h => cell(h, S.head));
  R.rows.forEach((r, i) => {
    const rowNo = 4 + i, z = i % 2 === 1, t = z ? S.zebra : S.text, n = z ? S.zebraNum : S.num;
    const catCells = L.map(l => cell(r.counts[l], n));
    const totF = 'SUM(' + C(3) + rowNo + ':' + C(2 + L.length) + rowNo + ')';
    const row = [cell(r.st.className, n), cell(r.st.name, t), cell(r.st.id, n)].concat(catCells)
      .concat([fcell(totF, r.total, S.total),
        cell(r.sev.text, r.sev.level === 'urgent' ? S.high : r.sev.level === 'severe' ? S.mid : n),
        cell(r.subjectStr || '—', t)]);
    if (isAdmin) row.push(cell(r.iv.text, r.iv.level === 'high' ? S.high : r.iv.level === 'mid' ? S.mid : t),
      cell((state.points[r.st.id] && state.points[r.st.id].adminNote) || '', S.note));
    sumSheet.rows[rowNo - 1] = row;
  });
  const sumLast = 3 + R.rows.length, sumTotRow = sumLast + 1;
  sumSheet.rows[sumTotRow - 1] = [cell('TOTAL', S.total), cell('', S.total), cell('', S.total)]
    .concat(L.map((l, j) => fcell('SUM(' + C(3 + j) + '4:' + C(3 + j) + sumLast + ')', R.colTotals[l], S.totalNum)))
    .concat([fcell('SUM(' + C(3 + L.length) + '4:' + C(3 + L.length) + sumLast + ')', R.grand, S.totalNum), cell('', S.total), cell('', S.total)]);
  sumSheet.filter = 'A3:' + C(sumCols.length - 1) + sumLast;

  // ---------- Recognition Log ----------
  const recs = [];
  state.students.filter(s => state.rClass === 'ALL' || s.className === state.rClass).forEach(st =>
    allRecognitionsCumulative(st.id).forEach(r => { if ((state.rSubject === 'ALL' || r.subject === state.rSubject) && inReportRange(r)) recs.push({ st, r }); }));
  recs.sort((a, b) => (b.r.time || b.r.date || '').localeCompare(a.r.time || a.r.date || ''));
  const recSheet = { name: 'Recognition Log', tab: 'FFF5A623', freeze: 3, merges: ['A1:I1', 'A2:I2'], heights: { 0: 26, 2: 30 },
    widths: [12, 12, 8, 34, 11, 26, 22, 30, 50], rows: [] };
  recSheet.rows[0] = [cell('Skills Recognition Log — every 4C skill recognised', S.title)];
  recSheet.rows[1] = [cell(filterText, S.sub)];
  recSheet.rows[2] = ['Date', 'Week of', 'Class', 'Student', 'ID', 'Recognition', 'Subject', 'Teacher', 'Teacher note'].map(h => cell(h, S.head));
  recs.forEach(({ st, r }, i) => {
    const z = i % 2 === 1, t = z ? S.zebra : S.text, n = z ? S.zebraNum : S.num;
    recSheet.rows[3 + i] = [cell(r.date || '', n), cell(r.date ? weekIdFor(new Date(r.date + 'T00:00:00')) : '', n), cell(st.className, n),
      cell(st.name, t), cell(st.id, n), cell((recogEmoji(r.label, r.emoji) ? recogEmoji(r.label, r.emoji) + ' ' : '') + r.label, t), cell(r.subject || '', t), cell(r.teacherName || '', t),
      cell(r.note || '', r.note ? S.note : t)];
  });
  if (!recs.length) recSheet.rows[3] = [cell('No recognitions recorded for this filter.', S.text)];
  recSheet.filter = 'A3:I' + Math.max(4, 3 + recs.length);

  // ---------- Dashboard ----------
  const W = 10; // dashboard is laid out across 10 columns
  const D = { name: 'Dashboard', tab: 'FF1F4E96', widths: [22, 32, 12, 13, 13, 13, 13, 14, 14, 30], merges: [], heights: {}, rows: [],
    image: { png: dataUriToBytes(LOGO_DATA_URI), w: 140, h: Math.round(140 * 103 / 260) } };
  let r = 0;
  const put = (row, cells) => { D.rows[row] = cells; };
  const section = (title) => { put(r, [cell(title, S.section)].concat(Array(W - 1).fill(cell('', S.section)))); D.merges.push('A' + (r + 1) + ':' + C(W - 1) + (r + 1)); D.heights[r] = 22; r++; };
  const table = (heads, rowsArr, wideFrom) => {
    const widen = (cells, st) => {
      if (wideFrom == null) return cells;
      D.merges.push(C(wideFrom) + (r + 1) + ':' + C(W - 1) + (r + 1));
      return cells.concat(Array(W - 1 - wideFrom).fill(cell('', st)));
    };
    put(r, widen(heads.map(h => cell(h, S.head)), S.head)); D.heights[r] = 30; r++;
    rowsArr.forEach(x => { put(r, widen(x, x[x.length - 1].s)); r++; }); r++;
  };

  put(0, [null, cell('Al-Rowad International Schools — G8 Boys Behaviour Report', S.title)]); D.merges.push('B1:' + C(W - 1) + '1'); D.heights[0] = 30;
  put(1, [null, cell(filterText, S.sub)]); D.merges.push('B2:' + C(W - 1) + '2');
  put(2, [null, cell('Tabs: Dashboard · Deduction Log (every flag + teacher note) · Student Summary · Recognition Log. Totals on this page are live formulas over the Deduction Log.', S.sub)]);
  D.merges.push('B3:' + C(W - 1) + '3'); D.heights[1] = 18; D.heights[2] = 18; D.heights[3] = 12;
  r = 4;

  // Key figures
  section('KEY FIGURES');
  const studentsFlagged = R.rows.filter(x => x.total > 0).length;
  const highList = isAdmin ? R.rows.filter(x => x.iv.level === 'high') : [];
  const midList = isAdmin ? R.rows.filter(x => x.iv.level === 'mid') : [];
  const kpis = [['Total flags', fcell('COUNTA(' + rng('F') + ')-COUNTIF(' + rng('F') + ',"")', R.grand, S.kpiValue)]]
    .concat(L.map(l => ['Not ' + l, fcell('COUNTIF(' + rng('F') + ',' + q('Not ' + l) + ')', R.colTotals[l], S.kpiValue)]))
    .concat([['Students flagged', cell(studentsFlagged, S.kpiValue)], ['Recognitions', cell(recs.length, S.kpiValue)]])
    .concat(isAdmin ? [['Student interventions', cell(highList.length, S.kpiValue)], ['Teacher sit-downs', cell(midList.length, S.kpiValue)]] : []);
  put(r, kpis.map(k => cell(k[0], S.kpiLabel))); D.heights[r] = 30; r++;
  put(r, kpis.map(k => k[1])); D.heights[r] = 36; r++; r++;

  // Deductions by category
  section('DEDUCTIONS BY CATEGORY');
  const catStart = r + 2;
  table(['Deduction', 'Count', '% of all flags'], L.map((l, j) => [cell('Not ' + l, S.text),
    fcell('COUNTIF(' + rng('F') + ',' + q('Not ' + l) + ')', R.colTotals[l], S.num),
    fcell('IF(SUM($B$' + catStart + ':$B$' + (catStart + L.length - 1) + ')=0,0,B' + (catStart + j) + '/SUM($B$' + catStart + ':$B$' + (catStart + L.length - 1) + '))',
      R.grand ? R.colTotals[L[j]] / R.grand : 0, S.pct)]));

  // Intervention lists (admin only)
  const ivRow = x => {
    const teachers = new Set(x.ded.map(d => d.teacherName || 'Unknown'));
    return [cell(x.st.className, S.num), cell(x.st.name, S.text), cell(x.st.id, S.num)].concat(L.map(l => cell(x.counts[l], S.num)))
      .concat([cell(x.total, S.totalNum), cell(Array.from(teachers).join(', '), S.text)]);
  };
  const wide = 4 + L.length; // teacher names span from this column to the last one
  const ivHeads = ['Class', 'Student', 'ID'].concat(L.map(l => 'Not ' + l)).concat(['Total', 'Teachers who flagged']);
  if (isAdmin) {
    section('STUDENT INTERVENTION LIST — flagged by more than 3 teachers in total (call the student in)');
    if (highList.length) table(ivHeads, highList.sort((a, b) => b.total - a.total).map(ivRow), wide);
    else { put(r++, [cell('No students currently meet this threshold.', S.sub)]); r++; }
    section('TEACHER INTERVENTION — sit with the teacher(s) (1–3 teachers flagging)');
    if (midList.length) table(['Class', 'Student', 'ID'].concat(L.map(l => 'Not ' + l)).concat(['Total', 'Sit with']),
      midList.sort((a, b) => b.total - a.total).map(x => { const row = ivRow(x); row[row.length - 1] = cell(x.iv.text.replace(/^Sit with /, ''), S.mid); return row; }), wide);
    else { put(r++, [cell('No students currently need a teacher sit-down.', S.sub)]); r++; }
  }

  // Flags by subject (live formulas)
  section('FLAGS BY SUBJECT — which subjects are flagging most');
  table(['Subject', 'Students flagged'].concat(L.map(l => 'Not ' + l)).concat(['Total']),
    R.subjects.map(s => {
      const rowNo = r + 1 + R.subjects.indexOf(s) + 1;
      return [cell(s.name, S.text), cell(s.students.size, S.num)]
        .concat(L.map(l => fcell('COUNTIFS(' + rng('G') + ',' + q(s.name) + ',' + rng('F') + ',' + q('Not ' + l) + ')', s.counts[l] || 0, S.num)))
        .concat([fcell('SUM(C' + rowNo + ':' + C(1 + L.length) + rowNo + ')', s.total, S.total)]);
    }));

  // Flags by teacher (admin only, live formulas)
  if (isAdmin) {
    section('FLAGS BY TEACHER — which teachers are flagging most');
    const tStart = r + 2;
    table(['Teacher', 'Subject(s)'].concat(L.map(l => 'Not ' + l)).concat(['Total', 'Students flagged']),
      R.teachers.map((t, i) => [cell(t.name, S.text), cell(Array.from(t.subjects).join(', '), S.text)]
        .concat(L.map(l => fcell('COUNTIFS(' + rng('H') + ',' + q(t.name) + ',' + rng('F') + ',' + q('Not ' + l) + ')', t.counts[l] || 0, S.num)))
        .concat([fcell('SUM(C' + (tStart + i) + ':' + C(1 + L.length) + (tStart + i) + ')', t.total, S.total), cell(t.students.size, S.num)])));
  }

  return XL.build([D, logSheet, sumSheet, recSheet]);
}

async function exportReportsXLSX() {
  clearMemo();
  let bytes;
  try { bytes = buildReportWorkbook(); } catch (e) { console.error(e); toast('Could not build the Excel report.'); return; }
  const name = 'G8_Behaviour_Report_' + (state.rClass === 'ALL' ? 'AllClasses' : state.rClass) + '_' +
    (state.rSubject === 'ALL' ? 'AllSubjects' : state.rSubject.replace(/[^A-Za-z0-9]+/g, '')) + '_' + todayISO() + '.xlsx';
  if (!state.downloadsCap) { toast('Download isn\'t available in this view.'); return; }
  try { await state.downloadsCap.save({ filename: name, data: bytes }); }
  catch (e) { if (!e || e.code !== 'declined') toast('Download failed: ' + ((e && e.message) || 'unknown error')); }
}


/* ============================= PARENT LETTERS (PDF) =============================
   One letter per student per week, gathering EVERYTHING they achieved (Top 5 place and every
   4C skill, with the subjects it was recognised in), so a family only ever receives one letter.
   The PDF is written directly (no external library): A4, standard Times/Helvetica fonts,
   and the AIS logo embedded with transparency. */
const LTR = { W: 595.28, H: 841.89, M: 64, NAVY: [0.043, 0.165, 0.333], GOLD: [0.97, 0.71, 0], GREY: [0.4, 0.44, 0.5], INK: [0.11, 0.13, 0.17] };

  TR: { pdf: 'Times-Roman', css: s => s + "px 'Times New Roman', Times, 'Liberation Serif', serif" },
  TB: { pdf: 'Times-Bold', css: s => 'bold ' + s + "px 'Times New Roman', Times, 'Liberation Serif', serif" },
  TI: { pdf: 'Times-Italic', css: s => 'italic ' + s + "px 'Times New Roman', Times, 'Liberation Serif', serif" },
  HR: { pdf: 'Helvetica', css: s => s + "px Helvetica, Arial, 'Liberation Sans', sans-serif" },
  HB: { pdf: 'Helvetica-Bold', css: s => 'bold ' + s + "px Helvetica, Arial, 'Liberation Sans', sans-serif" },

const LTR_FONT_KEYS = Object.keys(LTR_FONTS);
let _ltrCtx = null;
function ltrWidth(text, font, size) {
  if (!_ltrCtx) _ltrCtx = document.createElement('canvas').getContext('2d');
  _ltrCtx.font = LTR_FONTS[font].css(size);
  return _ltrCtx.measureText(text).width;
}
function ltrWrap(text, font, size, maxW) {
  const words = String(text).split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  words.forEach(w => { const t = line ? line + ' ' + w : w; if (line && ltrWidth(t, font, size) > maxW) { lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line);

}
/** PDF string literal in WinAnsi encoding. */
function ltrStr(s) {
  const map = { '–': 0x96, '—': 0x97, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '•': 0x95, '…': 0x85 };
  let out = '(';
  for (const ch of String(s)) {
    let code = map[ch] !== undefined ? map[ch] : ch.charCodeAt(0);
    if (code > 255) code = 63; // '?'
    if (ch === '(' || ch === ')' || ch === '\\') out += '\\' + ch;
    else if (code < 32 || code > 126) out += '\\' + code.toString(8).padStart(3, '0');
    else out += ch;
  }

}
function ltrPage() {
  const ops = [];
  const rgb = c => c.map(v => v.toFixed(3)).join(' ');
  return {
    ops,
    text(x, y, s, font, size, color) { ops.push(rgb(color || LTR.INK) + ' rg BT /' + font + ' ' + size + ' Tf ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Td ' + ltrStr(s) + ' Tj ET'); return ltrWidth(s, font, size); },
    textRight(xr, y, s, font, size, color) { this.text(xr - ltrWidth(s, font, size), y, s, font, size, color); },
    textCenter(xc, y, s, font, size, color) { this.text(xc - ltrWidth(s, font, size) / 2, y, s, font, size, color); },
    line(x1, y1, x2, y2, w, color) { ops.push(rgb(color) + ' RG ' + w + ' w ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + y2.toFixed(2) + ' l S'); },
    circle(cx, cy, r, color) {
      const k = 0.5523 * r;
      ops.push(rgb(color) + ' rg ' + [
        (cx + r) + ' ' + cy + ' m',
        (cx + r) + ' ' + (cy + k) + ' ' + (cx + k) + ' ' + (cy + r) + ' ' + cx + ' ' + (cy + r) + ' c',
        (cx - k) + ' ' + (cy + r) + ' ' + (cx - r) + ' ' + (cy + k) + ' ' + (cx - r) + ' ' + cy + ' c',
        (cx - r) + ' ' + (cy - k) + ' ' + (cx - k) + ' ' + (cy - r) + ' ' + cx + ' ' + (cy - r) + ' c',
        (cx + k) + ' ' + (cy - r) + ' ' + (cx + r) + ' ' + (cy - k) + ' ' + (cx + r) + ' ' + cy + ' c'].join(' ') + ' f');
    },
    image(name, x, y, w, h) { ops.push('q ' + w.toFixed(2) + ' 0 0 ' + h.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /' + name + ' Do Q'); },

}
async function ltrDeflate(bytes) {

async function ltrLogo() {

}
