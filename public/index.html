<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G8 Boys Discipline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Outfit:wght@600;700;800;900&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&family=Russo+One&family=Montserrat:wght@600;700;800;900&family=Bungee&family=Press+Start+2P&family=Permanent+Marker&family=Cinzel:wght@900&family=Playfair+Display:wght@900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --border: #E1E4E8;
    --text: #1B2430;
    --text-dim: #667085;
    --dark: #0F2D52;
    --dark-2: #0A1F38;
    --gold: #E8A93B;
    --gold-dark: #C98F26;
    --teal: #17A398;
    --teal-dark: #128276;
    --green: #1E9E64;
    --green-bg: #E9F8EF;
    --red: #E5484D;
    --red-bg: #FDEBEC;
    --amber: #F5A524;
    --amber-bg: #FEF3E2;
    --accent: #17A398;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141C; --surface: #1A2029; --border: #2C333F; --text: #EAECEF;
      --text-dim: #8B94A3; --dark: #0A1F38; --dark-2: #060F1D;
      --green-bg: #0F2A1D; --red-bg: #2E1315; --amber-bg: #2E2311;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141C; --surface: #1A2029; --border: #2C333F; --text: #EAECEF;
    --text-dim: #8B94A3; --dark: #0A1F38; --dark-2: #060F1D;
    --green-bg: #0F2A1D; --red-bg: #2E1315; --amber-bg: #2E2311;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px; line-height: 1.4;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  a { color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--text-dim); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .topbar { background: linear-gradient(135deg, var(--dark), var(--dark-2)); color: #fff; padding: 12px 18px;
    display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 14px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .topbar .brandrow { display:flex; align-items:center; gap:10px; }
  .topbar .brandrow img, .tb-left img { height: 44px; width: auto; display:block; }
  .apptitle { text-align: center; line-height: 1.2; }
  .apptitle .t1 { font-size: 18px; font-weight: 800; letter-spacing: .01em; }
  .apptitle .t2 { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #9cc3ef; margin-top: 3px; }
  .tb-right { display: flex; justify-content: flex-end; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .tb-user { display: flex; align-items: center; gap: 8px; }
  .btn.nav { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; letter-spacing: .02em; }
  .btn.nav svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn.nav.slim { padding: 6px 11px; font-size: 12px; }
  .role-pill { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #1b2430; background: var(--gold); border-radius: 999px; padding: 3px 10px; }
  @media (max-width: 1080px) {
    .topbar { grid-template-columns: auto 1fr; }
    .apptitle { text-align: left; }
    .tb-right { grid-column: 1 / -1; justify-content: flex-start; }
  }
  .topbar .brand { font-weight: 700; font-size: 15px; }
  .topbar .who { font-size: 13px; color: #C7CCD4; }
  .navrow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .btn:hover { border-color: var(--teal); }
  .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal-dark); box-shadow: 0 2px 6px rgba(23,163,152,.35); }
  .btn.primary:hover { background: var(--teal-dark); }
  .btn.gold { background: var(--gold); color: #1B2430; border-color: var(--gold-dark); box-shadow: 0 2px 6px rgba(232,169,59,.35); }
  .btn.ghost { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: #fff; }
  .btn.ghost:hover { background: rgba(255,255,255,.18); }
  .btn.nav { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); color: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.2); font-weight: 700; }
  .btn.nav:hover { background: rgba(255,255,255,.2); }
  .btn.nav.active { background: var(--gold); color: #1B2430; border-color: var(--gold-dark); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger { color: var(--red); border-color: var(--red); background: var(--red-bg); }

  .container { max-width: 1280px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--dark); }
  :root[data-theme="dark"] .card h2, @media (prefers-color-scheme: dark) { }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-dim); font-weight: 700; }
  .field select, .field input {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); min-width: 160px;
  }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 10px 14px; font-size: 14px; font-weight: 700; color: var(--text-dim); border-bottom: 3px solid transparent; cursor: pointer; }
  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }
  .name-reset { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .reset-btn { display: inline-flex; align-items: center; gap: 5px; flex: none; color: #059669; border-color: #a7f3d0; background: #ecfdf5; font-weight: 700; }
  .reset-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .reset-btn:disabled { opacity: .4; cursor: default; }
  .tab { display: inline-flex; align-items: center; gap: 7px; }
  .tab svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.gold { background: #FDF1DA; color: var(--gold-dark); }

  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: none; cursor: pointer; padding: 0; }
  .dot.green { background: #B7E4C7; }
  .dot.red { background: var(--red); }
  .countbubble { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 5px;
    background: var(--red); color:#fff; border-radius:999px; font-size:11px; font-weight:700; cursor:pointer; margin-left:5px; }
  .countbubble.zero { background: var(--border); color: var(--text-dim); cursor: default; }

  .layout2 { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .layout2 { grid-template-columns: 1fr; } }

  /* Mobile bottom sheet: on phone widths, the side panel (student name + Behavior
     Conduct / Skills Recognition boxes) slides up from the bottom instead of
     requiring a scroll past the roster — this is the primary teacher workflow
     on a phone, so it needs to be reachable without hunting for it. */
  .sheet-backdrop { display: none; }
  @media (max-width: 760px) {
    .sheet-backdrop {
      display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 44;
    }
    .sidepanel.sheet-open {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 45;
      height: 50vh; max-height: 75vh; margin: 0; gap: 10px;
      background: var(--bg); border-top-left-radius: 18px; border-top-right-radius: 18px;
      box-shadow: 0 -10px 34px rgba(0,0,0,.3); padding: 10px 14px calc(14px + env(safe-area-inset-bottom,0px));
      overflow-y: auto;
    }
    .sidepanel:not(.sheet-open) { display: none; }
  }
  @media (max-width: 760px) {
    /* Phone: the Skills header is pinned to the bottom edge of the pop-up panel as a pull tab;
       swiping it up slides the skills over the panel and lets the panel grow taller. */
    .sidepanel.sheet-open { height: 72vh; }
    .sidepanel.sheet-open .card { padding: 12px 14px; }
    .sidepanel.sheet-open .stotal { margin-bottom: 0; }
    .sidepanel.sheet-open > * { flex-shrink: 0; }
    .apptitle .t1 { font-size: 15px; } .apptitle .t2 { font-size: 9px; letter-spacing: .14em; }
  }
  @keyframes sheetSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 2px auto 8px; }
  .sheet-close { position: absolute; top: 10px; right: 14px; }

  .studentlist { max-height: 62vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
  .studentrow { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .studentrow:hover { background: var(--bg); }
  .studentrow.selected { background: var(--green-bg); }
  .studentrow .name { font-weight: 600; }
  .studentrow .dots { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-height: 18px; }
  .rskill { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 0 2px; cursor: pointer;
    font-size: 14px; line-height: 1; color: var(--text); }
  .rskill span { font-size: 11px; font-weight: 800; color: #c2410c; }
  .roster-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-right: var(--avg-pad, 2px); }
  .avg-cap { text-align: right; }
  .roster-head h2 { margin: 0; flex: 1; }
  .avgbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 34px; padding: 0 12px; flex: none;
    border-radius: 10px; background: #16a34a; color: #fff; font-weight: 800; font-size: 16px; }
  .avgbadge.warn { background: #d97706; }
  .avgbadge.danger { background: #dc2626; }
  .avg-cap { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); line-height: 1.3; }
  .top3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; align-self: flex-end; }
  .top3-label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
  .top3-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; font-weight: 800; font-size: 13px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.05); }
  .top3-chip b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: #1b2430; }
  .top3-chip em { font-style: normal; font-weight: 600; font-size: 11px; color: var(--text-dim); }
  .top3-chip.r1 b { background: linear-gradient(135deg, #fde68a, #f59e0b); }
  .top3-chip.r2 b { background: linear-gradient(135deg, #f1f5f9, #94a3b8); }
  .top3-chip.r3 b { background: linear-gradient(135deg, #fed7aa, #c2410c); color: #fff; }
  .studentrow .total { font-weight: 700; font-size: 15px; }

  .sidepanel { position: sticky; top: 16px; display:flex; flex-direction:column; gap:14px; }
  .sidepanel .sname { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .sidepanel .stotal { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
  .panelbox { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--surface); }
  .panelbox .boxlabel { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin-bottom: 10px; }
  .bigbtn {
    width: 100%; padding: 16px 10px; margin-bottom: 8px; border-radius: 10px;
    font-size: 15px; font-weight: 700; border: 2px solid transparent;
    background: var(--green-bg); color: var(--green);
  }
  .bigbtn.red { background: var(--red); color: #fff; }
  .bigbtn:disabled { opacity: .85; cursor: not-allowed; }
  .recogbtn {
    width: 100%; padding: 14px 10px; margin-bottom: 8px; border-radius: 10px;
    font-size: 14px; font-weight: 700; border: 2px solid var(--teal); background: #EAFBF9; color: var(--teal-dark);
  }
  .recogbtn:active { background: var(--teal); color: #fff; }
  /* ---------- Behavior Conduct values: glowing "intact" shields that visibly break when lost ---------- */
  .valbtn { position: relative; overflow: hidden; width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    padding: 15px 16px; border: 1px solid rgba(16,185,129,.55); border-radius: 14px; cursor: pointer; text-align: left;
    font-family: inherit; font-weight: 800; font-size: 16px; line-height: 1.2; letter-spacing: .02em; color: #fff;
    background: linear-gradient(120deg, #047857 0%, #10b981 55%, #34d399 100%);
    box-shadow: 0 6px 18px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.35);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  .val-ring { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px;
    background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 12px rgba(255,255,255,.55); }
  .val-label { flex: 1; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .val-chip { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.45); }
  .val-shine { display: none; }
  @keyframes valShine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  .valbtn.lost { cursor: not-allowed; border-color: rgba(220,38,38,.6); color: #fff;
    background: repeating-linear-gradient(135deg, rgba(0,0,0,.08) 0 8px, transparent 8px 16px), linear-gradient(120deg, #7f1d1d, #dc2626 60%, #ef4444);
    box-shadow: 0 6px 18px rgba(220,38,38,.35), inset 0 0 0 1px rgba(255,255,255,.12); opacity: 1; }
  .valbtn.lost .val-ring { background: rgba(0,0,0,.2); border-color: rgba(255,255,255,.6); box-shadow: none; }
  .valbtn.lost .val-label { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(255,255,255,.6); }
  .valbtn.lost .val-chip { background: #fff; color: #b91c1c; border-color: #fff; }
  .valbtn.lost .val-shine { display: none; }

  /* ---------- Card deck: Conduct and Skills share one space; Skills lies on top when open ---------- */
  .card-deck { display: grid; grid-template-columns: minmax(0, 1fr); }
  .card-deck > .conductbox { grid-area: 1 / 1; }
  .card-deck > .skillsbox { grid-area: 2 / 1; margin-top: 12px; }
  .card-deck.stacked > .skillsbox { grid-area: 1 / 1; margin-top: 44px; z-index: 2; align-self: stretch;
    box-shadow: 0 -6px 18px rgba(15,23,42,.18); }
  .card-deck.stacked .conduct-head { cursor: pointer; display: flex; align-items: center; }
  .deck-back { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: none; color: #059669; }
  /* ---------- Skills Recognition: white box, orange trim, pulled up to reveal ---------- */
  .panelbox.skillsbox { border-top: 3px solid #f97316; padding: 0; overflow: hidden; }
  .skills-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px; border: 0; background: var(--surface); cursor: pointer;
    font-family: inherit; text-align: left; touch-action: none; }
  .skills-star svg { width: 20px; height: 20px; fill: #f97316; stroke: #fb923c; stroke-width: 1; filter: drop-shadow(0 0 5px rgba(249,115,22,.65)); display: block; }
  .skills-title { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
  .skills-hint { margin-left: auto; font-size: 11px; font-weight: 700; color: #ea580c; letter-spacing: .04em; }
  .skills-hint .h-touch { display: none; }
  @media (hover: none) { .skills-hint .h-touch { display: inline; } .skills-hint .h-click { display: none; } }
  .skills-arrow { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: #fff7ed; box-shadow: 0 0 0 1px #fed7aa, 0 0 14px rgba(249,115,22,.55); }
  .skills-hint + .skills-arrow { margin-left: 0; }
  .skills-arrow svg { width: 18px; height: 18px; fill: none; stroke: #ea580c; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .skills-arrow.is-open { animation: none; box-shadow: 0 0 0 1px #fed7aa; }
  .skills-arrow.is-open svg { animation: none; }
  .skills-body { display: none; padding: 2px 14px 14px; }
  .skillsbox.open .skills-body { display: block; }
  .skillbtn { width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 9px; padding: 12px 14px; cursor: pointer; text-align: left;
    border: 1px solid #fb923c; border-radius: 12px; color: #fff; font-family: inherit; font-weight: 800; font-size: 14px; line-height: 1.25;
    background: linear-gradient(120deg, #c2410c 0%, #f97316 60%, #fb923c 100%);
    box-shadow: 0 5px 16px rgba(249,115,22,.3), inset 0 1px 0 rgba(255,255,255,.3);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  .skill-icon { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; line-height: 1;
    background: #fff; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 12px rgba(255,255,255,.55); }
  .skill-label { flex: 1; }
  .skill-count { background: #1f2937; color: #fdba74; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 900; letter-spacing: 0; }
  .skill-noteflag { font-size: 13px; color: #9a3412; margin: 4px 0 8px; }
  .btn.skill-save { background: #f97316; color: #fff; border-color: #ea580c; }
  .panelbox.conductbox { border-top: 3px solid #10b981; }
  .bd-subject { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .bd-subhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .bd-entry { padding: 6px 0; border-top: 1px dashed var(--border); }
  .bd-meta { font-size: 13px; }
  .bd-note { font-size: 13px; margin-top: 3px; padding: 6px 9px; background: var(--bg); border-left: 3px solid var(--red); border-radius: 4px; }
  .bd-nonote { color: var(--text-dim); font-style: italic; border-left-color: var(--border); }
  .noteflag { font-size: 12px; color: var(--text-dim); margin: 6px 0 12px; }
  textarea.note {
    width: 100%; min-height: 56px; padding: 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--text); font-size: 13px; resize: vertical;
  }
  .empty-hint { color: var(--text-dim); font-size: 13px; padding: 30px; text-align: center; }

  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  .login-card .field { margin-bottom: 14px; }
  .login-card select, .login-card input { width: 100%; }
  .login-card .btn.primary { width: 100%; padding: 11px; margin-top: 6px; }
  .error-text { color: var(--red); font-size: 13px; margin-top: 8px; }

    box-shadow: 0 4px 16px rgba(0,0,0,.3); }

  .form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 10px; }

  .lb-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap:14px; }

  /* ===================== Hallway display ===================== */
  .disp-stage { container-type: size; container-name: stage; overflow: hidden; color: #fff; box-sizing: border-box;
    font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(circle at 12% 18%, rgba(168,85,247,.55), transparent 42%),
                radial-gradient(circle at 88% 85%, rgba(14,165,233,.5), transparent 45%),
                radial-gradient(circle at 70% 8%, rgba(232,169,59,.35), transparent 35%),
                linear-gradient(140deg, #0a0520 0%, #160a3a 45%, #04193a 100%); }
  .disp-stage * { box-sizing: border-box; }
  .d-glow { position: absolute; width: 60cqmin; height: 60cqmin; border-radius: 50%; filter: blur(8cqmin); opacity: .45;
    animation: dFloat 14s ease-in-out infinite alternate; pointer-events: none; }
  .d-glow-a { background: #a855f7; top: -20cqmin; right: -10cqmin; }
  .d-glow-b { background: #06b6d4; bottom: -25cqmin; left: -15cqmin; animation-delay: -7s; }
  @keyframes dFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(6cqmin,4cqmin) scale(1.15); } }
  .d-inner { position: absolute; inset: 0; padding: 4cqmin 5cqmin 7cqmin; display: flex; flex-direction: column; gap: 3cqmin; }
  .d-head { display: flex; align-items: center; gap: 3cqmin; }
  .d-brand img { height: 10cqmin; width: auto; display: block; }
  .d-titles { flex: 1; min-width: 0; }

  .d-title { font-size: 8cqmin; font-weight: 900; line-height: 1.05;
    background: linear-gradient(90deg, #fde68a, #f472b6, #a78bfa, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .d-body { flex: 1; min-height: 0; display: flex; gap: 4cqmin; }
  .d-empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 6cqmin; font-weight: 800; }
  .d-rank { flex: none; width: 6cqmin; height: 6cqmin; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 3.2cqmin; background: linear-gradient(135deg, #a78bfa, #22d3ee); color: #0a0520; }

  .d-champs { flex-direction: row; align-items: stretch; }
  .d-podium { flex: 1.1; display: flex; align-items: flex-end; justify-content: center; gap: 2.5cqmin; }
  .d-pod { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; }
  .d-pod-medal { font-size: 8cqmin; line-height: 1.1; }
  .d-pod-class { font-size: 8.5cqmin; font-weight: 900; line-height: 1.05; }
  .d-pod-1 .d-pod-class { font-size: 11cqmin; text-shadow: 0 0 4cqmin rgba(253,230,138,.7); }
  .d-pod-score { font-size: 4.2cqmin; font-weight: 800; opacity: .92; margin-bottom: 1.5cqmin; }
  .d-pod-score small { font-size: 2.4cqmin; opacity: .75; }
  .d-pod-bar { width: 100%; border-radius: 2cqmin 2cqmin 0 0; display: flex; justify-content: center; padding-top: 2cqmin;
    font-size: 5cqmin; font-weight: 900; color: rgba(0,0,0,.5); transform-origin: bottom; }
  .d-pod-1 .d-pod-bar { height: 32cqmin; background: linear-gradient(180deg, #fde68a, #f59e0b); box-shadow: 0 0 5cqmin rgba(245,158,11,.6); }
  .d-pod-2 .d-pod-bar { height: 23cqmin; background: linear-gradient(180deg, #f1f5f9, #94a3b8); }
  .d-pod-3 .d-pod-bar { height: 16cqmin; background: linear-gradient(180deg, #fdba74, #c2410c); }
  .d-list { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.6cqmin; }
  .d-row { display: flex; align-items: center; gap: 2.2cqmin; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    border-radius: 2cqmin; padding: 1.3cqmin 2.2cqmin; }
  .d-rowname { font-size: 4.2cqmin; font-weight: 800; width: 11cqmin; }
  .d-meter { flex: 1; height: 1.6cqmin; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
  .d-meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6); }
  .d-cstar { flex: none; font-size: 2.8cqmin; font-weight: 900; color: #fde68a; background: rgba(253,230,138,.14);
    border: 1px solid rgba(253,230,138,.4); border-radius: 999px; padding: .3cqmin 1.4cqmin; }
  .d-pod-star { font-size: 3.2cqmin; font-weight: 900; color: #fde68a; margin: -0.8cqmin 0 1.4cqmin; }
  .d-list.d-full { width: 100%; flex: 1; min-height: 0; }
  .d-tiebody { flex-direction: column; gap: 2cqmin; }
  .d-tiebanner { flex: none; align-self: center; font-size: 4.2cqmin; font-weight: 900; color: #1b2430; padding: .8cqmin 4cqmin; border-radius: 999px;
    background: linear-gradient(90deg, #fde68a, #f9a8d4, #a5b4fc); box-shadow: 0 0 4cqmin rgba(253,230,138,.45); }
  @container stage (orientation: landscape) {
    .d-list.d-2col { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); grid-template-rows: repeat(var(--rows, 5), minmax(0,1fr)); grid-auto-flow: column; column-gap: 3cqmin; }
  }
  .d-rowscore { font-size: 4cqmin; font-weight: 900; min-width: 10cqmin; text-align: right; }

  .d-stars { display: grid; grid-template-columns: minmax(0,1fr); grid-auto-rows: minmax(0, 13cqmin); align-content: center; gap: 2cqmin; }
  /* 6-8 stars in landscape: two columns of up to 4 so nothing spills past the header or footer. */
  @container stage (orientation: landscape) {
    .d-stars.d-many { grid-template-columns: repeat(2, minmax(0,1fr)); grid-template-rows: repeat(var(--rows, 5), minmax(0,1fr)); grid-auto-rows: auto; grid-auto-flow: column; align-content: stretch; }
    .d-stars.d-many .d-star-name { font-size: 2.8cqmin; line-height: 1.12; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .d-stars.d-many .d-chip { padding: .35cqmin .9cqmin; gap: .3cqmin; }
    .d-stars.d-many .d-chip b { font-size: 2.1cqmin; }

    .d-stars.d-many .d-chip { font-size: 2.5cqmin; }
  }
  .d-star { display: flex; align-items: center; gap: 3cqmin; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    border-radius: 2.5cqmin; padding: 1.8cqmin 3cqmin; }
  .d-star-top { background: linear-gradient(90deg, rgba(245,158,11,.35), rgba(236,72,153,.25)); border-color: rgba(253,230,138,.6);
    box-shadow: 0 0 4cqmin rgba(245,158,11,.35); }
  .d-star-main { flex: 1; min-width: 0; }
  .d-star-name { font-size: 4.6cqmin; font-weight: 900; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-star-class { font-size: 2.5cqmin; font-weight: 700; color: #7dd3fc; letter-spacing: .2em; }
  .d-stars-wrap { flex-direction: column; gap: 2cqmin; }
  .d-stars-wrap > .d-stars { flex: 1; min-height: 0; }
  .d-stars-wrap > .d-empty { flex: 1; }
  .d-star-meta { display: flex; align-items: center; gap: 1.6cqmin; margin-top: .3cqmin; }
  .d-pts { font-size: 2.3cqmin; font-weight: 900; padding: .2cqmin 1.2cqmin; border-radius: 999px; background: rgba(255,255,255,.16); letter-spacing: .02em; }
  .class-emblem.em-star { width: 6.2cqmin; height: 6.2cqmin; flex: none; }
  .d-many .class-emblem.em-star { width: 5.2cqmin; height: 5.2cqmin; }
  .d-legend { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .8cqmin 1.4cqmin; font-size: 2cqmin; font-weight: 700; }
  .d-legend-title { font-weight: 900; letter-spacing: .18em; text-transform: uppercase; opacity: .7; }
  .d-legend-item { display: inline-flex; align-items: center; gap: .8cqmin; padding: .5cqmin 1.4cqmin; border-radius: 999px;
    background: rgba(127,127,127,.16); border: 1px solid rgba(127,127,127,.3); }
  .d-legend-ico { font-size: 2.5cqmin; line-height: 1; }
  .d-chips { display: flex; gap: 1.4cqmin; flex-wrap: wrap; justify-content: flex-end; }
  .d-chip { display: inline-flex; align-items: center; gap: .6cqmin; font-size: 4.4cqmin; background: rgba(0,0,0,.28);
    border-radius: 999px; padding: .5cqmin 1.8cqmin; }
  .d-chip b { font-size: 3cqmin; font-weight: 900; }
  .d-many .d-star { padding: .8cqmin 2.4cqmin; gap: 2cqmin; }
  .d-many .d-star-name { font-size: 3.6cqmin; }
  .d-many .d-chip { font-size: 3.4cqmin; }

  .d-improved { flex-direction: row; }
  .d-card { flex: 1; border-radius: 3cqmin; padding: 3.5cqmin; display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; gap: 1.4cqmin; border: 1px solid rgba(255,255,255,.18); }
  .d-card-class { background: linear-gradient(160deg, rgba(34,211,238,.28), rgba(99,102,241,.22)); }
  .d-card-student { background: linear-gradient(160deg, rgba(236,72,153,.28), rgba(245,158,11,.22)); }
  .d-card-kicker { font-size: 2.6cqmin; letter-spacing: .25em; font-weight: 800; color: #fde68a; }
  .d-card-big { font-size: 15cqmin; font-weight: 900; line-height: 1; }
  .d-card-name { font-size: 4.8cqmin; font-weight: 900; line-height: 1.15; }
  .d-card-name span { display: block; font-size: 2.6cqmin; color: #7dd3fc; letter-spacing: .2em; font-weight: 700; }
  .d-delta { font-size: 10cqmin; font-weight: 900; color: #4ade80; text-shadow: 0 0 4cqmin rgba(74,222,128,.6); line-height: 1; }
  .d-fromto { font-size: 3cqmin; opacity: .85; font-weight: 700; }
  .d-card-note { font-size: 4.4cqmin; font-weight: 800; }

  @container stage (orientation: portrait) {
    .d-champs, .d-improved { flex-direction: column; }
    .d-podium { flex: none; }
    .d-star { flex-wrap: wrap; }
    .d-star-name { white-space: normal; }
    .d-chips { width: 100%; justify-content: flex-start; padding-left: 9cqmin; }
    /* Portrait screens are tall: rows share the full height so wrapped chips never spill into the next row. */
    .d-stars { grid-auto-rows: minmax(0, 1fr); align-content: stretch; }
    .d-stars.d-many .d-star-name { font-size: 3.8cqmin; }
    .d-stars.d-many .d-chip { font-size: 3cqmin; }
    .d-star { align-content: center; row-gap: 1cqmin; }
  }

  .d-foot { position: absolute; left: 5cqmin; right: 5cqmin; bottom: 2.5cqmin; display: flex; align-items: center; gap: 3cqmin; }
  .d-dots { display: flex; gap: 1.2cqmin; }
  .d-dots i { width: 1.6cqmin; height: 1.6cqmin; border-radius: 50%; background: rgba(255,255,255,.3); display: block; }
  .d-dots i.on { background: #fde68a; box-shadow: 0 0 2cqmin #fde68a; }
  .d-progress { flex: 1; height: .8cqmin; background: rgba(255,255,255,.15); border-radius: 999px; overflow: hidden; }
  .d-progress i { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, #22d3ee, #f472b6, #fde68a);
    animation-name: dProgress; animation-timing-function: linear; animation-fill-mode: both; }
  @keyframes dProgress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  /* ===================== Hallway themes ===================== */
  .theme-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .theme-label { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin-right: 4px; }
  .theme-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .theme-chip.active { border-color: var(--dark); box-shadow: 0 0 0 2px var(--dark) inset; }
  .theme-sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); flex: none; }
  .d-navbtn { position: fixed; top: 50%; transform: translateY(-50%); z-index: 10; width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.35); color: #fff; font-size: 34px; line-height: 1; cursor: pointer; }
  .d-prev { left: 14px; } .d-next { right: 14px; }
  .d-enter .b-row, .d-enter .lg-row, .d-enter .lg-podium { animation: dRise .7s cubic-bezier(.2,.9,.3,1.1) both; }

  /* ---- shared "board" layout (AIS + Smooth): top 5 rows ---- */
  .b-board { flex-direction: column; justify-content: center; gap: 2.2cqmin; }
  .b-row { display: flex; align-items: center; gap: 2.5cqmin; height: 11cqmin; flex: none; }
  .b-six .b-row { height: 9.5cqmin; }
  .b-pos { flex: none; width: 8cqmin; display: flex; justify-content: center; align-items: center; font-size: 5cqmin; font-weight: 900; }
  .b-medal { height: 9.5cqmin; width: auto; display: block; }
  .b-avatar { flex: none; width: 9cqmin; height: 9cqmin; border-radius: 50%; display: grid; place-items: center; }
  .b-avatar svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .class-emblem { display: block; flex: none; border-radius: 20%; overflow: hidden; box-shadow: 0 .6cqmin 1.8cqmin rgba(0,0,0,.35); }

  .class-emblem.em-row { width: 6.4cqmin; height: 6.4cqmin; }

  .d-pod:has(.em-pod) .d-pod-medal { font-size: 4.2cqmin; line-height: 1; margin-bottom: .4cqmin; }
  .d-pod:has(.em-pod) .d-pod-class { font-size: 6.4cqmin; }
  .d-pod-1:has(.em-pod) .d-pod-class { font-size: 8cqmin; }
  .d-pod:has(.em-pod) .d-pod-score { font-size: 3.2cqmin; }
  .class-emblem.em-card { width: 16cqmin; height: 16cqmin; margin: 0 auto 1.5cqmin; }
  .class-emblem.lg-em { width: 9cqmin; height: 9cqmin; margin: .8cqmin auto; }
  .class-emblem.em-sm { width: 4.4cqmin; height: 4.4cqmin; display: inline-block; vertical-align: middle; margin-right: 1.4cqmin; box-shadow: none; }
  .b-bar { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 3cqmin; padding: 0 4cqmin; }
  .b-name { flex: 1; min-width: 0; font-size: 4.6cqmin; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-name small { font-size: 2.3cqmin; font-weight: 700; margin-left: 2cqmin; opacity: .8; letter-spacing: .05em; }
  .b-stars { flex: none; font-size: 4cqmin; letter-spacing: .5cqmin; color: #fbbf24; }
  .b-stars i { font-style: normal; color: rgba(255,255,255,.28); }
  .b-score { flex: none; font-size: 5.2cqmin; font-weight: 900; min-width: 12cqmin; text-align: right; }
  @container stage (orientation: portrait) {
    .b-row { height: 13cqmin; } .b-stars { font-size: 3.2cqmin; } .b-name small { display: none; }

<div id="app"></div>

<div id="toastHost"></div>
<script>
/* =========================================================================
   G8 BOYS DISCIPLINE TRACKER — 100-Point Weekly Retention System
   Data model (kept deliberately small in DOCUMENT COUNT, since this
   artifact's database caps at 5,000 documents total):
     students/{sNumber}      -> { name, className, contact }        (~237 docs, fixed)
     staff/{staffId}         -> { name, email, eNumber, subject, className, role, pin }  (small)
     points/{sNumber}        -> { weeks: { [weekId]: { total, deductions:[...] } } }     (~237 docs, fixed)
   All of a student's history across every week lives inside ONE points
   document (nested by week), so the document COUNT never grows over
   time — only each document's size does, which stays tiny even after
   years of use.
   ========================================================================= */

const CLASSES = ['8A','8B','8C','8E','8F','8G','8H','8I','8J','8K','8L'];
const WEEK_START_POINTS = 100;
const DEDUCTION_AMOUNT = 5;
const RECOGNITION_FLOOR = 75;
const DEFAULT_CONDUCT_CATEGORIES = [
  { key: 'ready', label: 'Ready' },
  { key: 'respectful', label: 'Respectful' },
  { key: 'safe', label: 'Safe' },
];
const DEFAULT_RECOGNITION_TYPES = [
  { key: 'communication', emoji: '💬', label: 'Communication of Knowledge' },
  { key: 'critical',      emoji: '⚙️', label: 'Critical Thinking & Problem-Solving' },
  { key: 'creativity',    emoji: '💡', label: 'Creativity & Innovation' },
  { key: 'collaboration', emoji: '🤝', label: 'Collaboration' },
];
/** Admin-editable via Settings; falls back to defaults until config/settings loads. */
function conductCategories() { return (state.config && state.config.conductCategories) || DEFAULT_CONDUCT_CATEGORIES; }
/** Icon for a recognition label from the current Settings; falls back to the icon saved on the record. */
function recogEmoji(label, fallback) { const t = recognitionTypes().find(x => x.label === label); return (t && t.emoji) || fallback || ''; }
const DEFAULT_SEVERITY = { urgentAbove: 30, notableBelow: 15 };
const DEFAULT_INTERVENTION_BELOW = 85;
/** Students with FEWER points than this in a week appear on the Needs Intervention lists. */
function interventionBelow() {
  const v = state.config && +state.config.interventionBelow;
  return Number.isFinite(v) && v > 0 ? v : DEFAULT_INTERVENTION_BELOW;
}
function severitySettings() {
  const s = (state.config && state.config.severity) || {};
  return { urgentAbove: Number.isFinite(+s.urgentAbove) ? +s.urgentAbove : DEFAULT_SEVERITY.urgentAbove,
           notableBelow: Number.isFinite(+s.notableBelow) ? +s.notableBelow : DEFAULT_SEVERITY.notableBelow };
}
/** Weekly severity: Urgent = more than U flags; Notable = 1 to below N; Severe = N..U. No flags = none. */
function severityFor(flags) {
  const { urgentAbove: U, notableBelow: N } = severitySettings();
  if (!flags) return { level: 'none', text: '—' };
  if (flags > U) return { level: 'urgent', text: 'Urgent' };
  if (flags < N) return { level: 'notable', text: 'Notable' };
  return { level: 'severe', text: 'Severe' };
}
/** Which Student Flags report columns teachers can see (set by admin with the glasses icons).
 *  Everything is visible by default except Recommended Intervention. */
function teacherCanSee(key) {
  const tc = (state.config && state.config.teacherColumns) || {};
  return key === 'intervention' ? tc[key] === true : tc[key] !== false;
}
async function toggleTeacherCol(key) {
  const val = !teacherCanSee(key);
  state.config = Object.assign({}, state.config, { teacherColumns: Object.assign({}, (state.config && state.config.teacherColumns) || {}, { [key]: val }) });
  render();
  try { await state.db.doc('config/settings').update({ teacherColumns: { [key]: val } }); }
  catch (e) { try { await state.db.doc('config/settings').set(Object.assign({}, state.config)); } catch (e2) { toast('Could not save that setting.'); } }
}

function colEye(key) {
  const on = teacherCanSee(key);
  return '<button class="col-eye' + (on ? ' on' : '') + '" title="' + (on ? 'Visible to teachers. Click to hide' : 'Hidden from teachers. Click to show') + '" ' +
    'onclick="event.stopPropagation();toggleTeacherCol(\'' + jsAttr(key) + '\')">' + GLASSES + '</button>';
}

/* ---------------- date / week helpers ---------------- */
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function weekIdFor(dateObj) {
  // Sunday-start school week. Returns the ISO date (YYYY-MM-DD) of that week's Sunday.
  const d = new Date(dateObj);
  d.setHours(0,0,0,0);
  const day = d.getDay(); // 0 = Sunday
  d.setDate(d.getDate() - day);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function currentWeekId() { return weekIdFor(new Date()); }
function formatWeekLabel(weekId) {
  const start = new Date(weekId + 'T00:00:00');
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return fmt(start) + ' – ' + fmt(end);
}

/* ---------------- points helpers ---------------- */
function getWeekData(sNumber, weekId) {
  const doc = state.points[sNumber];
  if (!doc || !doc.weeks || !doc.weeks[weekId]) {
    return { total: WEEK_START_POINTS, deductions: [] };
  }
  return doc.weeks[weekId];
}
function weeklyTotal(sNumber, weekId) {
  return getWeekData(sNumber, weekId).total;
}
function deductionsThisWeek(sNumber, weekId) {
  return getWeekData(sNumber, weekId).deductions || [];
}
/** Has THIS subject already logged THIS category for this student TODAY? (daily button lock) */
function isLockedToday(sNumber, subject, category) {
  const today = todayISO();
  return deductionsThisWeek(sNumber, currentWeekId()).some(
    d => d.subject === subject && d.category === category && d.date === today
  );
}
/** Has ANY subject deducted this category for this student, this week? (roster dot) */
function categoryFlaggedThisWeek(sNumber, category, weekId) {
  return deductionsThisWeek(sNumber, weekId).some(d => d.category === category);
}
function whoFlagged(sNumber, category, weekId) {
  return deductionsThisWeek(sNumber, weekId).filter(d => d.category === category);
}

async function applyDeduction(sNumber, category, subject, teacher, note) { return applyDeductionMany([sNumber], category, subject, teacher, note); }
async function applyDeductionMany(ids, category, subject, teacher, note) {
  if (!state.db) { toast("Not connected — try again in a moment."); return []; }
  const weekId = currentWeekId(), now = new Date().toISOString(), today = todayISO();
  const jobs = ids.map(sNumber => {
    const current = state.points[sNumber] || { weeks: {} };
    const weekData = current.weeks && current.weeks[weekId] ? current.weeks[weekId] : { total: WEEK_START_POINTS, deductions: [] };
    const deductions = (weekData.deductions || []).concat([{ category, subject, teacherId: teacher.id, teacherName: teacher.name, note: note || '', date: today, time: now }]);
    const wk = { total: WEEK_START_POINTS - DEDUCTION_AMOUNT * deductions.length, deductions };
    return { sNumber, wk };
  });
  const results = await Promise.all(jobs.map(j => writeWeek(j.sNumber, weekId, j.wk)));
  const ok = jobs.filter((j, i) => results[i]);
  if (ok.length < jobs.length) toast('Could not save ' + (jobs.length - ok.length) + ' entr' + (jobs.length - ok.length === 1 ? 'y' : 'ies') + ' — please retry.');
  render();
  return ok.map(j => j.sNumber);
}
/** Save one student's week (merge), creating the record if needed, and update the screen copy. */
async function writeWeek(sNumber, weekId, wk) {
  const payload = { weeks: { [weekId]: wk } }, ref = state.db.doc('points/' + sNumber);
  try { await ref.update(payload); }
  catch (e) { try { await ref.set(payload); } catch (e2) { console.error(e2); return false; } }
  if (!state.points[sNumber]) state.points[sNumber] = { weeks: {} };
  state.points[sNumber].weeks = state.points[sNumber].weeks || {};
  state.points[sNumber].weeks[weekId] = Object.assign({}, state.points[sNumber].weeks[weekId], wk);
  return true;
}

function recognitionsThisWeek(sNumber, weekId) {
  return getWeekData(sNumber, weekId).recognitions || [];
}
/** label is the frozen display text (identity), not a lookup key — renaming/deleting a
 *  recognition type in Settings never changes what's already been recorded. */
function recognitionCount(sNumber, weekId, label) {
  return recognitionsThisWeek(sNumber, weekId).filter(r => r.label === label).length;
}
async function giveRecognition(sNumber, recogDescriptor, teacher, subject) { return giveRecognitionMany([sNumber], recogDescriptor, teacher, subject); }
async function giveRecognitionMany(ids, recogDescriptor, teacher, subject) {
  if (!state.db) { toast("Not connected — try again in a moment."); return []; }
  const weekId = currentWeekId(), now = new Date().toISOString(), today = todayISO();
  const jobs = ids.map(sNumber => {
    const current = state.points[sNumber] || { weeks: {} };
    const weekData = current.weeks && current.weeks[weekId] ? current.weeks[weekId] : { total: WEEK_START_POINTS, deductions: [] };
    const recognitions = (weekData.recognitions || []).concat([{ label: recogDescriptor.label, emoji: recogDescriptor.emoji,
      teacherId: teacher.id, teacherName: teacher.name, subject: subject || '', date: today, time: now }]);
    return { sNumber, wk: { total: weekData.total == null ? WEEK_START_POINTS : weekData.total, deductions: weekData.deductions || [], recognitions } };
  });
  const results = await Promise.all(jobs.map(j => writeWeek(j.sNumber, weekId, j.wk)));
  if (results.some(r => !r)) toast('Some recognitions could not be saved — please retry.');
  render();
  return jobs.filter((j, i) => results[i]).map(j => j.sNumber);
}

/** Homepage leaderboard for one recognition type & week:
 *  walk point-bands 100→75 (never below 75), include each whole band
 *  (ties never split) until the running total reaches >=5. */
function computeRecognitionLeaderboard(weekId, recogDescriptor) {
  const label = recogDescriptor.label;
  const candidates = state.students.map(st => {
    const wd = getWeekData(st.id, weekId);
    const count = (wd.recognitions || []).filter(r => r.label === label).length;
    return { id: st.id, name: st.name, className: st.className, total: wd.total, count };
  }).filter(c => c.count > 0 && c.total >= RECOGNITION_FLOOR);

  const totals = Array.from(new Set(candidates.map(c => c.total))).sort((a, b) => b - a);
  let result = [];
  for (const t of totals) {
    const band = candidates.filter(c => c.total === t).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    result = result.concat(band);
    if (result.length >= 5) break;
  }
  return result;
}

/** Admin's chosen reporting period (teachers always see all-time). Dates are YYYY-MM-DD, inclusive. */
function isoAddDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function reportRange() {
  if (!(state.user && state.user.role === 'admin')) return null;
  const r = state.rRange || 'all', today = todayISO(), wk = currentWeekId();
  if (r === 'week') return { from: wk, to: isoAddDays(wk, 6), label: 'This week' };
  if (r === 'lastweek') return { from: isoAddDays(wk, -7), to: isoAddDays(wk, -1), label: 'Last week' };
  if (r === 'month') return { from: today.slice(0, 8) + '01', to: today, label: 'This month' };
  if (r === 'custom' && (state.rFrom || state.rTo)) return { from: state.rFrom || '', to: state.rTo || '', label: (state.rFrom || '…') + ' to ' + (state.rTo || '…') };
  return null;
}
function inReportRange(x) {
  const R = reportRange(); if (!R) return true;
  const d = x.date || ''; return (!R.from || d >= R.from) && (!R.to || d <= R.to);
}
function reportPeriodLabel() { const R = reportRange(); return R ? R.label : 'All time'; }
function setRRange(v) { state.rRange = v; render(); }
function setRDate(which, v) { state[which] = v; render(); }
function allDeductionsCumulative(sNumber) {
  const doc = state.points[sNumber];
  if (!doc || !doc.weeks) return [];
  let all = [];
  Object.values(doc.weeks).forEach(w => { if (w.deductions) all = all.concat(w.deductions); });
  return all.filter(d => d.category !== 'Admin Adjustment');
}
function allRecognitionsCumulative(sNumber) {
  const doc = state.points[sNumber];
  if (!doc || !doc.weeks) return [];
  let all = [];
  Object.values(doc.weeks).forEach(w => { if (w.recognitions) all = all.concat(w.recognitions); });
  return all;
}
/** Combined-total intervention rule (cumulative, all-time):
 *  for each distinct conduct category ever logged for this student, count the
 *  DISTINCT teachers who logged it, then ADD those per-category counts together
 *  (a teacher who flagged two different categories counts once in each).
 *  >3 combined -> "Student intervention". 1-3 -> "Sit with <teacher names>" (deduped by name).
 *  0 -> no flag. */
function computeIntervention(sNumber, subjectFilter) {
  let all = allDeductionsCumulative(sNumber).filter(inReportRange);
  if (subjectFilter && subjectFilter !== 'ALL') all = all.filter(d => d.subject === subjectFilter);
  const byCategory = {};
  all.forEach(d => {
    if (!byCategory[d.category]) byCategory[d.category] = new Set();
    byCategory[d.category].add(d.teacherId);
  });
  let combinedTotal = 0;
  const namesByTeacherId = {};
  all.forEach(d => { namesByTeacherId[d.teacherId] = d.teacherName; });
  Object.values(byCategory).forEach(set => { combinedTotal += set.size; });

  if (combinedTotal === 0) return { level: 'none', combinedTotal, text: '—' };
  const allTeacherIds = new Set();
  Object.values(byCategory).forEach(set => set.forEach(id => allTeacherIds.add(id)));
  const names = Array.from(allTeacherIds).map(id => namesByTeacherId[id]).filter(Boolean);
  if (combinedTotal > 3) {
    return { level: 'high', combinedTotal, text: 'Student intervention' };
  }
  return { level: 'mid', combinedTotal, text: 'Sit with ' + names.join(', ') };
}

async function adminSetTotal(sNumber, weekId, newTotal, reasonNote) {
  const docRef = state.db.doc('points/' + sNumber);
  const current = state.points[sNumber] || { weeks: {} };
  const weekData = current.weeks && current.weeks[weekId] ? current.weeks[weekId] : { total: WEEK_START_POINTS, deductions: [] };
  const newDeductions = weekData.deductions.concat([{
    category: 'Admin Adjustment', subject: 'Admin',
    teacherId: state.user.id, teacherName: state.user.name + ' (admin)',
    note: reasonNote || 'Manual total override', date: todayISO(), time: new Date().toISOString(),
    manualTotalOverride: newTotal,
  }]);
  const payload = { weeks: {} };
  payload.weeks[weekId] = { total: newTotal, deductions: newDeductions };
  try { await docRef.update(payload); } catch (e) { await docRef.set(payload); }
  if (!state.points[sNumber]) state.points[sNumber] = { weeks: {} };
  state.points[sNumber].weeks = state.points[sNumber].weeks || {};
  state.points[sNumber].weeks[weekId] = { total: newTotal, deductions: newDeductions };
  render();
}

async function initCapabilities() {
  try { state.db = await claude.use('db'); } catch (e) { state.db = null; }
  try { state.downloadsCap = await claude.use('downloads'); } catch (e) { state.downloadsCap = null; }

    render();
    return;
  }
  state.dbStatus = 'connecting';
  subscribeStudents();
  subscribeStaff();
  subscribePoints();

  // restore session (per-viewer convenience only — not a security boundary)
  try {

function subscribeStudents() {
  state.db.collection('students').onSnapshot(snap => {
    state.students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loaded.students = true;
    maybeRestoreSession();
    render();

}
/** Old records had singular `subject`/`className`; new ones have `subjects`/`classes` arrays
 * (or `classes: ['ALL']`). Normalize on read so nothing existing breaks. */
function normalizeStaff(rec) {
  const out = Object.assign({}, rec);
  if (!Array.isArray(out.subjects)) out.subjects = out.subject ? [out.subject] : [];
  if (!Array.isArray(out.classes)) out.classes = out.className ? [out.className] : [];
  return out;
}
function staffTeachesClass(staffRec, cls) {
  return staffRec.classes.includes('ALL') || staffRec.classes.includes(cls);
}

function subscribeStaff() {
  state.db.collection('staff').onSnapshot(snap => {
    state.staff = snap.docs.map(d => normalizeStaff({ id: d.id, ...d.data() }));
    state.loaded.staff = true;
    maybeRestoreSession();
    render();
  }, err => { console.error('staff sub error', err); });
}
function subscribePoints() {
  state.db.collection('points').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { next[d.id] = d.data(); });
    state.points = next;
    state.loaded.points = true;
    render();
  }, err => { console.error('points sub error', err); });

function subscribeConfig() {

const MASTER_ADMIN_USERNAME = ''; // checked on the server (Netlify)

  return { id: 'master-admin', name: 'Admin', email: MASTER_ADMIN_USERNAME, role: 'admin', subjects: [], classes: ['ALL'] };

const MASTER_TEACHER_USERNAME = '';

function maybeRestoreSession() {
  if (state.user || !state.selectedStaffId) return;

    state.user = masterAdminUser();
    state.view = 'admin';
    return;

  if (state.selectedStaffId === 'MASTER_TEACHER') {
    if (!state.loaded.staff) return; // wait for staff to load so the subject list is accurate
    state.user = masterTeacherUser();
    state.view = 'teacher';
    return;
  }
  if (!state.loaded.staff) return;
  const found = state.staff.find(s => s.id === state.selectedStaffId);
  if (found) {
    state.user = found;
    state.view = found.role === 'admin' ? 'admin' : 'teacher';
  }

/* ---------------- one-time roster seeding ---------------- */
async function seedRosterIfNeeded() {
  if (state.students.length > 0) {
    toast('Student database already has ' + state.students.length + ' students — nothing to seed.');
    return;
  }
  state.seeding = true;
  render();
  let done = 0;
  for (const [sNumber, name, className] of SEED_STUDENTS) {
    try {
      await state.db.doc('students/' + sNumber).set({ name, className, contact: '' });
      await state.db.doc('points/' + sNumber).set({ weeks: {} });
    } catch (e) { console.error('seed error for', sNumber, e); }
    done++;
    state.seedProgress = done + ' / ' + SEED_STUDENTS.length;
    if (done % 8 === 0) render();
  }
  state.seeding = false;
  toast('Seeded ' + done + ' students.');
  render();
}

async function seedTeachersIfNeeded() {
  const existingEnums = new Set(state.staff.map(s => s.id));
  const alreadyDone = EMBEDDED_STAFF.every(([eNumber]) => existingEnums.has(eNumber));
  if (alreadyDone) {
    toast('Teacher accounts are already loaded.');
    return;
  }
  state.seeding = true;
  render();
  let done = 0;
  for (const [eNumber, name, subject, email] of EMBEDDED_STAFF) {
    try {
      await state.db.doc('staff/' + eNumber).set({
        name, email, eNumber, subjects: [subject], classes: ['ALL'], role: 'teacher', pin: eNumber,
      });
    } catch (e) { console.error('teacher seed error for', eNumber, e); }
    done++;
    state.seedProgress = done + ' / ' + EMBEDDED_STAFF.length;
    if (done % 8 === 0) render();
  }
  state.seeding = false;
  toast('Loaded ' + done + ' teacher accounts. Each signs in with their email + E-number as password.');
  render();
}

/* ---------------- CSV export ---------------- */
async function exportCSV(filename, headers, rows) {
  const esc = (v) => {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [headers.map(esc).join(',')].concat(rows.map(r => r.map(esc).join(','))).join('\n');
  if (state.downloadsCap) {
    try {
      await state.downloadsCap.save({ filename, data: csv });
      return;
    } catch (e) { console.error(e); }
  }
  toast('Download isn\'t available in this view.');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/** Safely embed a free-text value (e.g. an admin-editable category label) as a
 *  single-quoted JS string argument inside an HTML onclick="..." attribute.
 *  Escapes for the JS-string layer first, then the HTML-attribute layer. */

    if (!doc || !doc.weeks || !doc.weeks[weekId]) return null;
    const deductions = (doc.weeks[weekId].deductions || []).slice();
    for (let i = deductions.length - 1; i >= 0; i--) { // the entry just made (latest matching)
      if (deductions[i].category === cat && deductions[i].subject === state.tSubject && deductions[i].teacherId === state.user.id) {
        deductions[i] = Object.assign({}, deductions[i], { note }); break;
      }
    }
    return writeWeek(sNumber, weekId, { total: doc.weeks[weekId].total, deductions });
  }).filter(Boolean);
  const res = await Promise.all(jobs);
  if (note) toast(res.every(Boolean) ? 'Note saved.' : 'Could not save every note — please retry.');
  render();
}

/* ============================= SUMMARY COMPUTATION ============================= */
/** "⭐ 12" chip for a class's total recognitions this week (nothing if zero). */
function classStarChip(c) {
  return c.recognitions > 0 ? ' <span class="recog-badge" title="Skills Recognitions this week">⭐ ' + c.recognitions + '</span>' : '';
}
/** Students ranked by points, then skills recognitions this week. Level on both = same rank,
 *  listed alphabetically. Only students with at least one skill recognition are included. */
function computeTopStudents(weekId, n) { return memo('ts:' + weekId + ':' + n, () => _computeTopStudents(weekId, n)); }
function _computeTopStudents(weekId, n) {
  const list = state.students.map(st => {
    const wd = getWeekData(st.id, weekId);
    const recs = wd.recognitions || [];
    const groups = {};
    recs.forEach(r => { const g = groups[r.label] || (groups[r.label] = { emoji: r.emoji || '⭐', label: r.label, count: 0 }); g.count++; });
    return { id: st.id, name: st.name, className: st.className, total: wd.total, skills: recs.length,
      groups: recognitionTypes().map(t => groups[t.label]).filter(Boolean).concat(Object.values(groups).filter(g => !recognitionTypes().some(t => t.label === g.label))) };
  }).filter(s => s.skills > 0)
    .sort((a,b) => b.total - a.total || b.skills - a.skills || a.name.localeCompare(b.name));
  list.forEach((s, i) => { const p = list[i - 1]; s.rank = p && p.total === s.total && p.skills === s.skills ? p.rank : i + 1; });
  return list.filter(s => s.rank <= n);
}
function topStudentRows(weekId, withLetters) {
  const all = computeTopStudents(weekId, 5), top = all.slice(0, 5), more = all.length - top.length;
  return top.map(s => '<div class="rankrow"><span class="rn">' + s.rank + '.</span><span>' + escapeHtml(s.name) +
    ' <span class="subtle">(' + s.className + ')</span> <span class="recog-badge" title="Skills recognitions this week">⭐ ' + s.skills + '</span></span><b>' + s.total + '</b></div>').join('') +
    (more > 0 ? '<div class="subtle" style="padding-top:6px;">+' + more + ' more tied</div>' : '')
    || '<div class="subtle">No skills recognitions yet this week.</div>';
}
function computeWeekSummary(weekId) { return memo('ws:' + weekId, () => _computeWeekSummary(weekId)); }
function _computeWeekSummary(weekId) {
  const perStudent = state.students.map(st => ({
    id: st.id, name: st.name, className: st.className, total: weeklyTotal(st.id, weekId)
  }));

  const byClass = {};
  CLASSES.forEach(c => byClass[c] = []);
  perStudent.forEach(p => { if (!byClass[p.className]) byClass[p.className] = []; byClass[p.className].push(p); });
  Object.keys(byClass).forEach(c => byClass[c].sort((a,b) => b.total - a.total)); // highest first, lowest at bottom

  // Average, not sum — classes have different roll counts, so a raw total isn't a fair comparison.
  // Ranking: average points first (compared at the 1 decimal shown on screen), then total
  // Special Recognitions earned by the class that week as the tie-breaker. Classes still level
  // on both share the same rank number (1, 1, 3...) rather than being split arbitrarily.
  const classTotals = Object.keys(byClass).map(c => {
    const count = byClass[c].length;
    const sum = byClass[c].reduce((s,p) => s + p.total, 0);
    const average = count > 0 ? sum / count : 0;
    const recognitions = byClass[c].reduce((s,p) => s + recognitionsThisWeek(p.id, weekId).length, 0);
    return { className: c, count, average, avgKey: Math.round(average * 10) / 10, recognitions };
  }).filter(c => c.count > 0)
    .sort((a,b) => b.avgKey - a.avgKey || b.recognitions - a.recognitions || a.className.localeCompare(b.className));
  classTotals.forEach((c, i) => {
    const prev = classTotals[i - 1];
    c.rank = (prev && prev.avgKey === c.avgKey && prev.recognitions === c.recognitions) ? prev.rank : i + 1;
  });

  // Needs Intervention: every student below the admin's threshold (Settings), lowest first.
  const cut = interventionBelow();
  const bottom = perStudent.filter(p => p.total < cut).sort((a,b) => a.total - b.total || a.name.localeCompare(b.name));

  return { byClass, classTotals, bottom, perStudent };
}

function renderSummaryTab() {
  const weekOptions = getAvailableWeeks().map(w =>
    '<option value="' + w + '"' + (w === state.aWeek ? ' selected' : '') + '>' + formatWeekLabel(w) + (w === currentWeekId() ? ' (current)' : '') + '</option>'
  ).join('');
  const summary = computeWeekSummary(state.aWeek);

  const classRankingRows = summary.classTotals.map((c,i) =>
    '<div class="rankrow"><span class="rn">' + c.rank + '.</span><span>' + c.className + ' <span class="subtle">(' + c.count + ' students)</span>' + classStarChip(c) + '</span><b>' + c.average.toFixed(1) + '</b></div>'
  ).join('') || '<div class="subtle">No data for this week.</div>';

  const top10 = summary.classTotals.filter(c => c.rank <= 10);
  const top10Rows = top10.map((c,i) =>
    '<div class="rankrow"><span class="rn">' + c.rank + '.</span><span>' + c.className + classStarChip(c) + '</span><b>' + c.average.toFixed(1) + '</b></div>'
  ).join('') || '<div class="subtle">No data.</div>';

  const bottomRows = summary.bottom.map(p =>
    '<div class="rankrow"><span>' + escapeHtml(p.name) + ' <span class="subtle">(' + p.className + ')</span></span><b class="pill red">' + p.total + '</b></div>'
  ).join('') || '<div class="subtle">Nobody below ' + interventionBelow() + ' points this week.</div>';

  const perClassBlocks = CLASSES.filter(c => summary.byClass[c] && summary.byClass[c].length > 0).map(c => {
    const rows = summary.byClass[c].map((p,i) => {
      const dedList = deductionsThisWeek(p.id, state.aWeek);
      const subjBreak = {};
      dedList.forEach(d => { if (d.category !== 'Admin Adjustment') subjBreak[d.subject] = (subjBreak[d.subject]||0) + 1; });
      const subjStr = Object.keys(subjBreak).map(s => s + ' (' + subjBreak[s] + ')').join(', ');
      const recogBadges = recognitionTypes().map(r => {
        const cnt = recognitionCount(p.id, state.aWeek, r.label);
        return cnt > 0 ? '<span class="recog-badge">' + r.emoji + (cnt>1?' x'+cnt:'') + '</span>' : '';
      }).join('');
      return '<div class="rankrow"><span class="rn">' + (i+1) + '.</span><span>' + escapeHtml(p.name) +
        (recogBadges ? ' ' + recogBadges : '') +
        (subjStr ? '<br><span class="subtle">' + escapeHtml(subjStr) + '</span>' : '') + '</span>' +
        '<b class="pill ' + (p.total>=90?'green':(p.total>=75?'amber':'red')) + '">' + p.total + '</b></div>';
    }).join('');
    return '<div class="card"><h2>' + c + '</h2>' + rows + '</div>';
  }).join('');

  const recogCards = recognitionTypes().map(r => {

    const rows = board.map(p =>
      '<div class="rankrow"><span>' + escapeHtml(p.name) + ' <span class="subtle">(' + p.className + ')</span></span><span>' + r.emoji.repeat(Math.min(p.count,5)) + ' <span class="subtle">' + p.total + 'pt</span></span></div>'
    ).join('') || '<div class="subtle">Nobody yet this week.</div>';
    return '<div class="card"><h2>' + r.emoji + ' ' + escapeHtml(r.label) + '</h2>' + rows + '</div>';
  }).join('');

  return '<div class="row" style="margin-bottom:14px;">' +
      '<div class="field"><label>Week</label><select onchange="setAWeek(this.value)">' + weekOptions + '</select></div>' +
      '<button class="btn small" style="align-self:flex-end;" onclick="exportSummaryCSV()">Download CSV</button>' +
      '<button class="btn small primary letters-btn" style="align-self:flex-end;" onclick="openLetterPreview()">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="8" rx="1.5"/><path d="M7 13.5h10v7H7z"/></svg>' +
        'Print student recognition letters (' + letterStudents(state.aWeek).length + ')</button>' +
    '</div>' +
    '<div class="row" style="align-items:flex-start;">' +
      '<div class="card" style="flex:1;min-width:260px;"><h2>🏆 All Classes (avg pts)</h2>' + classRankingRows + '</div>' +
      '<div class="card" style="flex:1;min-width:260px;"><h2>⭐ Top 5 Students</h2>' + topStudentRows(state.aWeek, true) + '</div>' +
      '<div class="card" style="flex:1;min-width:260px;"><h2>Needs Intervention <span class="subtle">(below ' + interventionBelow() + ' pts)</span></h2>' + bottomRows + '</div>' +
    '</div>' +
    '<h2 style="margin:18px 4px 8px;">Skills Recognition</h2>' +
    '<div class="lb-grid" style="margin-bottom:18px;">' + recogCards + '</div>' +

    perClassBlocks;
}

/** Editing happens on a local draft, never on the live state.config — the live
 *  subscription can redeliver at any moment and would otherwise wipe out unsaved rows. */
function ensureConfigDraft() {
  if (!state.configDraft) {
    state.configDraft = {
      conductCategories: conductCategories().map(c => Object.assign({}, c)),
      recognitionTypes: recognitionTypes().map(r => Object.assign({}, r)),
      severity: Object.assign({}, severitySettings()),
      interventionBelow: interventionBelow(),
    };
  }
  return state.configDraft;
}

function updateDraftField(kind, idx, field, value) {
  const draft = ensureConfigDraft();
  const list = kind === 'conduct' ? draft.conductCategories : draft.recognitionTypes;
  if (list[idx]) list[idx][field] = value;
  // no render() here — re-rendering on every keystroke would fight the cursor; the
  // draft object already holds the latest value for add/remove/save to read.
}
function addConfigRow(kind) {
  const draft = ensureConfigDraft();
  if (kind === 'conduct') draft.conductCategories.push({ key: 'cat' + Date.now(), label: '' });
  else draft.recognitionTypes.push({ key: 'rec' + Date.now(), emoji: '✨', label: '' });
  render();
}
function removeConfigRow(kind, idx) {
  const draft = ensureConfigDraft();
  if (kind === 'conduct') { if (draft.conductCategories.length <= 1) return; draft.conductCategories.splice(idx, 1); }
  else { if (draft.recognitionTypes.length <= 1) return; draft.recognitionTypes.splice(idx, 1); }
  render();
}
function updateIntervention() {
  const v = parseInt(document.getElementById('ivBelow').value, 10);
  if (Number.isFinite(v)) ensureConfigDraft().interventionBelow = v;
}
function updateSeverity() {
  const draft = ensureConfigDraft();
  const u = parseInt(document.getElementById('sevUrgent').value, 10), n = parseInt(document.getElementById('sevNotable').value, 10);
  if (Number.isFinite(u)) draft.severity.urgentAbove = u;
  if (Number.isFinite(n)) draft.severity.notableBelow = n;
  document.getElementById('sevMidLo').textContent = draft.severity.notableBelow;
  document.getElementById('sevMidHi').textContent = draft.severity.urgentAbove;
  document.getElementById('sevErr').style.display = draft.severity.notableBelow < draft.severity.urgentAbove ? 'none' : 'block';
}
function discardConfigDraft() { state.configDraft = null; render(); }
async function saveConfig() {
  const draft = ensureConfigDraft();
  const conductCats = draft.conductCategories.filter(c => c.label.trim() !== '');
  const recogTypes = draft.recognitionTypes.filter(r => r.label.trim() !== '');
  if (conductCats.length === 0 || recogTypes.length === 0) {
    toast('At least one category and one recognition type are required.');
    return;
  }
  const sev = draft.severity || severitySettings();
  if (!(sev.notableBelow >= 1 && sev.urgentAbove > sev.notableBelow)) { toast('Severity: the Notable number must be lower than the Urgent number.'); return; }
  try {
    await state.db.doc('config/settings').set({ conductCategories: conductCats, recognitionTypes: recogTypes,
      severity: { urgentAbove: sev.urgentAbove, notableBelow: sev.notableBelow },
      teacherColumns: (state.config && state.config.teacherColumns) || {},
      interventionBelow: Math.min(100, Math.max(1, draft.interventionBelow || DEFAULT_INTERVENTION_BELOW)) });
    state.configDraft = null; // live subscription will now repopulate state.config with the saved version
    toast('Settings saved.');
    render();
  } catch (e) { toast('Could not save settings.'); console.error(e); }
}

/** Shared data for the Reports view and its CSV export: per-student flag counts plus
 *  per-subject and per-teacher totals, all cumulative and respecting the class/subject filters.
 *  Columns = current conduct categories + any retired labels still in history, so a row's
 *  Total always equals the sum of its visible columns. */
function computeReportData(role) { return memo('rd:' + role + ':' + state.rClass + ':' + state.rSubject + ':' + state.rSort + ':' + reportPeriodLabel(), () => _computeReportData(role)); }
function _computeReportData(role) {
  const isAdmin = role === 'admin';
  const roster = state.students
    .filter(s => state.rClass === 'ALL' || s.className === state.rClass)
    .sort((a,b) => a.className.localeCompare(b.className) || a.name.localeCompare(b.name));
  const current = conductCategories().map(c => c.label);
  const rows = roster.map(st => {
    let ded = allDeductionsCumulative(st.id).filter(inReportRange);
    if (state.rSubject !== 'ALL') ded = ded.filter(d => d.subject === state.rSubject);
    return { st, ded };
  });
  const seen = new Set();
  rows.forEach(r => r.ded.forEach(d => seen.add(d.category)));
  const extra = Array.from(seen).filter(l => !current.includes(l)).sort();
  const labels = current.concat(extra);
  const retired = new Set(extra);
  const colTotals = {};
  labels.forEach(l => { colTotals[l] = 0; });
  const subj = {}, teach = {};
  let grand = 0;
  rows.forEach(r => {
    r.counts = {};
    labels.forEach(l => { r.counts[l] = 0; });
    r.bySubject = {};
    r.ded.forEach(d => {
      const subject = d.subject || '—';
      r.counts[d.category]++;
      colTotals[d.category]++;
      r.bySubject[subject] = (r.bySubject[subject] || 0) + 1;
      const s = subj[subject] || (subj[subject] = { name: subject, counts: {}, total: 0, students: new Set() });
      s.counts[d.category] = (s.counts[d.category] || 0) + 1; s.total++; s.students.add(r.st.id);
      const key = d.teacherId || d.teacherName || 'unknown';
      const t = teach[key] || (teach[key] = { name: d.teacherName || 'Unknown', subjects: new Set(), counts: {}, total: 0, students: new Set() });
      t.subjects.add(subject); t.counts[d.category] = (t.counts[d.category] || 0) + 1; t.total++; t.students.add(r.st.id);
    });
    r.total = r.ded.length;
    grand += r.total;
    r.subjectStr = Object.keys(r.bySubject)
      .sort((a,b) => r.bySubject[b] - r.bySubject[a] || a.localeCompare(b))
      .map(s => s + ' ' + r.bySubject[s]).join(' · ');
    if (isAdmin || teacherCanSee('intervention')) r.iv = computeIntervention(r.st.id, state.rSubject);
    const wk = deductionsThisWeek(r.st.id, currentWeekId()).filter(d => d.category !== 'Admin Adjustment' && (state.rSubject === 'ALL' || d.subject === state.rSubject));
    r.weekFlags = wk.length;
    r.sev = severityFor(r.weekFlags);
  });
  if (state.rSort === 'severity') {
    const order = { urgent: 0, severe: 1, notable: 2, none: 3 };
    rows.sort((a, b) => order[a.sev.level] - order[b.sev.level] || b.weekFlags - a.weekFlags || b.total - a.total ||
      a.st.className.localeCompare(b.st.className) || a.st.name.localeCompare(b.st.name));
  }
  const byTotal = (a,b) => b.total - a.total || a.name.localeCompare(b.name);
  return { labels, retired, rows, colTotals, grand,
    subjects: Object.values(subj).sort(byTotal),
    teachers: isAdmin ? Object.values(teach).sort(byTotal) : [] };
}

function flagSummaryTable(items, labels, grand, isTeacherTable) {
  if (!items.length) return '<div class="subtle">No flags recorded for this filter.</div>';
  const head = '<tr><th>' + (isTeacherTable ? 'Teacher' : 'Subject') + '</th>' + (isTeacherTable ? '<th>Subject(s)</th>' : '') +
    labels.map(l => '<th>' + escapeHtml(l) + '</th>').join('') +
    '<th>Total</th><th>% of all flags</th><th>Students flagged</th></tr>';
  const body = items.map(it => '<tr><td><b>' + escapeHtml(it.name) + '</b></td>' +
    (isTeacherTable ? '<td>' + escapeHtml(Array.from(it.subjects).join(', ')) + '</td>' : '') +
    labels.map(l => '<td>' + (it.counts[l] || 0) + '</td>').join('') +
    '<td><b>' + it.total + '</b></td><td>' + (grand ? Math.round(it.total / grand * 100) : 0) + '%</td><td>' + it.students.size + '</td></tr>').join('');
  return '<div class="scrollx"><table class="flag-sum' + (isTeacherTable ? ' teachers' : '') + '"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function renderReportBreakdownModal() {
  if (!state.reportBreakdownFor) return '';
  const { sNumber, category } = state.reportBreakdownFor;
  const st = state.students.find(s => s.id === sNumber);
  let ded = allDeductionsCumulative(sNumber).filter(inReportRange).filter(d => d.category === category);
  if (state.rSubject !== 'ALL') ded = ded.filter(d => d.subject === state.rSubject);
  const bySubject = {};
  ded.forEach(d => { (bySubject[d.subject || '—'] = bySubject[d.subject || '—'] || []).push(d); });
  const rows = Object.keys(bySubject)
    .sort((a,b) => bySubject[b].length - bySubject[a].length || a.localeCompare(b))

function exportReportsCSV() {
  const isAdmin = state.user && state.user.role === 'admin';
  const R = computeReportData(isAdmin ? 'admin' : 'teacher');
  const L = R.labels;
  const pct = n => (R.grand ? Math.round(n / R.grand * 100) : 0) + '%';
  const out = [];
  out.push(['Filter', 'Class: ' + (state.rClass === 'ALL' ? 'All classes' : state.rClass),
            'Subject: ' + (state.rSubject === 'ALL' ? 'All subjects' : state.rSubject), 'All-time (cumulative)']);
  out.push([]);
  out.push(['STUDENT FLAGS']);
  out.push(['Class', 'Student', 'S-Number'].concat(L).concat(['Total', 'Flagged in (subject count)'])
    .concat(isAdmin ? ['Recommended Intervention', 'Admin note'] : []));
  R.rows.forEach(r => {
    const row = [r.st.className, r.st.name, r.st.id].concat(L.map(l => r.counts[l])).concat([r.total, r.subjectStr]);
    if (isAdmin) row.push(r.iv.text, (state.points[r.st.id] && state.points[r.st.id].adminNote) || '');
    out.push(row);
  });
  out.push(['TOTALS', '', ''].concat(L.map(l => R.colTotals[l])).concat([R.grand]));
  out.push([]);
  out.push(['FLAGS BY SUBJECT']);
  out.push(['Subject'].concat(L).concat(['Total', '% of all flags', 'Students flagged']));
  R.subjects.forEach(s => out.push([s.name].concat(L.map(l => s.counts[l] || 0)).concat([s.total, pct(s.total), s.students.size])));
  if (isAdmin) {
    out.push([]);
    out.push(['FLAGS BY TEACHER']);
    out.push(['Teacher', 'Subject(s)'].concat(L).concat(['Total', '% of all flags', 'Students flagged']));
    R.teachers.forEach(t => out.push([t.name, Array.from(t.subjects).join(' / ')].concat(L.map(l => t.counts[l] || 0)).concat([t.total, pct(t.total), t.students.size])));
  }
  exportCSV('reports_' + state.rClass + '_' + state.rSubject + '.csv', out[0], out.slice(1));
}

async function resetStudentWeek(sNumber) {
  const st = state.students.find(s => s.id === sNumber);
  const w = state.aWeek;
  const prev = (state.points[sNumber] && state.points[sNumber].weeks && state.points[sNumber].weeks[w]) || {};
  const n = (prev.deductions || []).length;
  if (!(await appDialog({ title: 'Reset ' + (st ? st.name : sNumber) + ' to all green?',
    message: 'Week of ' + formatWeekLabel(w) + ': removes ' + n + ' deduction(s) and restores ' + WEEK_START_POINTS + ' points. Skills recognitions are not affected. The removed deductions are kept in an audit log.',
    okLabel: 'Reset to green' }))) return;
  const resetLog = (prev.resetLog || []).concat([{ by: state.user.name, byId: state.user.id, at: new Date().toISOString(),
    previousTotal: prev.total == null ? WEEK_START_POINTS : prev.total, removed: prev.deductions || [] }]);
  const payload = { weeks: {} };
  payload.weeks[w] = { total: WEEK_START_POINTS, deductions: [], resetLog };
  const ref = state.db.doc('points/' + sNumber);
  try { await ref.update(payload); }
  catch (e) { try { await ref.set(payload); } catch (e2) { toast('Could not reset — please try again.'); return; } }
  if (!state.points[sNumber]) state.points[sNumber] = { weeks: {} };
  state.points[sNumber].weeks = state.points[sNumber].weeks || {};
  state.points[sNumber].weeks[w] = Object.assign({}, state.points[sNumber].weeks[w], payload.weeks[w]);
  toast((st ? st.name : sNumber) + ' reset to all green.');
  render();
}
async function saveMasterOverride(sNumber) {
  const val = parseInt(document.getElementById('master_' + sNumber).value, 10);
  if (isNaN(val)) { toast('Enter a number.'); return; }
  const reason = await appDialog({ title: 'Set total to ' + val + '?', message: 'Optional: add a reason for this manual override.', input: true, placeholder: 'Reason (optional)', okLabel: 'Update' });
  if (reason === null) return;
  await adminSetTotal(sNumber, state.aWeek, val, reason);
  toast('Updated.');
}
